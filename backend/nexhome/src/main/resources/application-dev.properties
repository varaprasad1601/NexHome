spring.config.import=optional:file:.env[.properties]

# The schema is owned by Flyway (db/migration); Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.nexhome=DEBUG

# No SMS provider yet: log generated OTPs so they can be used locally. Never enable outside dev.
nexhome.otp.log-plaintext=true

# Any local page may call the API, e.g. the web app (5173) or api-docs.html opened from IntelliJ (63342)
nexhome.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
