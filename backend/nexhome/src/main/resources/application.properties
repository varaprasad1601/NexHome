spring.application.name=nexhome
#spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false

# OTPs (nexhome_auth_otp_requests)
nexhome.otp.length=6
nexhome.otp.expiry-minutes=5
nexhome.otp.max-attempts=5
nexhome.otp.resend-cooldown-seconds=60
nexhome.otp.log-plaintext=false

# SMS for OTPs: log (none; the default) or msg91 (needs the auth key and the DLT-approved OTP template)
nexhome.sms.provider=${SMS_PROVIDER:log}
nexhome.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
nexhome.sms.msg91.otp-template-id=${MSG91_OTP_TEMPLATE_ID:}
nexhome.sms.msg91.otp-variable=${MSG91_OTP_VARIABLE:otp}
nexhome.sms.msg91.flow-url=https://control.msg91.com/api/v5/flow
nexhome.sms.msg91.timeout-seconds=10

# Push notifications to the customer and partner apps (V53): log (default, nothing pushed) or fcm, which needs the
# Firebase service account key (Project settings > Service accounts > Generate new private key; keep it out of git)
nexhome.push.provider=${PUSH_PROVIDER:log}
nexhome.push.fcm.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
nexhome.push.fcm.project-id=${FIREBASE_PROJECT_ID:}
nexhome.push.fcm.timeout-seconds=10

# Login tokens. JWT_SECRET: Base64 of at least 32 random bytes, e.g. `openssl rand -base64 48`
nexhome.security.jwt-secret=${JWT_SECRET}
nexhome.security.jwt-issuer=nexhome
nexhome.security.access-token-minutes=15
nexhome.security.refresh-token-days=30
nexhome.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Encrypts Aadhaar, document and bank account numbers. DATA_ENCRYPTION_KEY: Base64 of exactly 32 random bytes,
# e.g. `openssl rand -base64 32`; changing it makes the stored values unreadable
nexhome.security.data-encryption-key=${DATA_ENCRYPTION_KEY}

# Uploads: service images are stored in the database, at most 5 MB each
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# File storage (NexHomeStorageProperties): local (a folder on this machine), s3 (a private AWS bucket) or r2 (a private
# Cloudflare R2 bucket). Private files open through links valid for download-url-minutes.
nexhome.storage.provider=${STORAGE_PROVIDER:local}
nexhome.storage.local.root=${STORAGE_LOCAL_ROOT:${user.home}/nexhome-storage}
nexhome.storage.s3.bucket=${S3_BUCKET:}
nexhome.storage.s3.region=${S3_REGION:ap-south-1}
nexhome.storage.s3.access-key=${S3_ACCESS_KEY:}
nexhome.storage.s3.secret-key=${S3_SECRET_KEY:}
nexhome.storage.s3.endpoint=${S3_ENDPOINT:}
nexhome.storage.r2.endpoint=${R2_ENDPOINT:}
nexhome.storage.r2.bucket=${R2_BUCKET:}
nexhome.storage.r2.access-key=${R2_ACCESS_KEY:}
nexhome.storage.r2.secret-key=${R2_SECRET_KEY:}
nexhome.storage.download-url-minutes=5
nexhome.storage.unattached-hours=24

# Payment provider webhooks (Module 7): the HMAC-SHA256 key of X-NexHome-Signature. Without one every webhook is refused
nexhome.payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
