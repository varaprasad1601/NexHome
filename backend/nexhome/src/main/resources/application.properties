spring.application.name=nexhome
#spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false

# OTPs (nexhome_auth_otp_requests)
nexhome.otp.length=6
nexhome.otp.expiry-minutes=5
nexhome.otp.max-attempts=5
nexhome.otp.resend-cooldown-seconds=60
nexhome.otp.log-plaintext=false

# Login tokens. JWT_SECRET: Base64 of at least 32 random bytes, e.g. `openssl rand -base64 48`
nexhome.security.jwt-secret=${JWT_SECRET}
nexhome.security.jwt-issuer=nexhome
nexhome.security.access-token-minutes=15
nexhome.security.refresh-token-days=30
nexhome.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Encrypts Aadhaar, document and bank account numbers. DATA_ENCRYPTION_KEY: Base64 of exactly 32 random bytes,
# e.g. `openssl rand -base64 32`; changing it makes the stored values unreadable
nexhome.security.data-encryption-key=${DATA_ENCRYPTION_KEY}

# Uploads: service images are stored in the database, at most 5 MB each
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
