<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexHome API</title>
<style>
/* Light by default; a softer dark theme only when chosen with the Theme button */
:root {
  --bg: #f7f9fc; --panel: #ffffff; --text: #26303e; --muted: #667085; --border: #e3e8ef;
  --brand: #1e293b; --accent: #0f766e; --code-bg: #f3f5f9;
  --side: #ffffff; --side-text: #344054; --side-muted: #8a94a6; --side-hover: #f2f5f7; --side-active: #e6f4f1; --side-active-text: #0f766e;
  --side-border: #e3e8ef; --input-bg: #f7f9fc;
  --get: #2563eb; --post: #16a34a; --put: #d97706; --delete: #dc2626;
  --req: #dc2626; --opt: #16a34a; --no: #b45309; --path: #475569;
  --ok-bg: #ecfdf3; --err-bg: #fef3f2;
}
:root[data-theme="dark"] {
  --bg: #1f2430; --panel: #282e3b; --text: #e4e7ec; --muted: #a3acbb; --border: #3a4252;
  --brand: #e2e8f0; --accent: #14b8a6; --code-bg: #303747;
  --side: #252b37; --side-text: #d0d5dd; --side-muted: #98a2b3; --side-hover: #2f3644; --side-active: #1f3d3a; --side-active-text: #5eead4;
  --side-border: #3a4252; --input-bg: #1f2430;
  --get: #60a5fa; --post: #22c55e; --put: #f59e0b; --delete: #f87171;
  --req: #f87171; --opt: #4ade80; --no: #fbbf24; --path: #cbd5e1;
  --ok-bg: #1d3528; --err-bg: #3b2526;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--text); background: var(--bg); display: flex; }
code, pre, textarea, input.mono { font-family: Consolas, "Cascadia Mono", "Courier New", monospace; }

/* Sidebar */
aside { width: 300px; flex: 0 0 300px; background: var(--side); color: var(--side-text); border-right: 1px solid var(--side-border); height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; }
.brand { padding: 18px 18px 10px; }
.brand h1 { margin: 0; font-size: 18px; color: var(--brand); }
.brand small { color: var(--side-muted); }
.search { margin: 6px 14px 10px; }
.search input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--side-border); background: var(--input-bg); color: var(--text); outline: none; }
.search input:focus, .side-foot input:focus { border-color: var(--accent); }
.search input::placeholder { color: var(--side-muted); }
nav { overflow-y: auto; padding: 0 8px 16px; flex: 1; }
.group-toggle { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 6px; padding: 9px 10px; border: 0; border-radius: 6px; background: none; color: var(--side-text); font: inherit; font-weight: 600; text-align: left; cursor: pointer; }
.group-toggle:hover { background: var(--side-hover); }
.group-toggle span:first-child { flex: 1; }
.group-toggle .count { font-size: 11px; font-weight: 600; color: var(--side-muted); background: var(--input-bg); border: 1px solid var(--side-border); border-radius: 999px; padding: 0 7px; }
.group-toggle .chevron { width: 8px; height: 8px; border-right: 2px solid var(--side-muted); border-bottom: 2px solid var(--side-muted); transform: rotate(45deg); margin: -4px 4px 0 2px; transition: transform .15s; }
.group-toggle.open .chevron { transform: rotate(-135deg); margin-top: 3px; }
.group-items { padding-left: 6px; margin-bottom: 4px; }
.group-items.collapsed { display: none; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--side-text); text-decoration: none; cursor: pointer; }
.nav-item:hover { background: var(--side-hover); }
.nav-item.active { background: var(--side-active); color: var(--side-active-text); font-weight: 600; }
.nav-item .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-foot { padding: 10px 14px; border-top: 1px solid var(--side-border); font-size: 12px; display: grid; gap: 8px; }
.side-foot label { display: flex; justify-content: space-between; align-items: center; color: var(--side-muted); margin-bottom: 4px; }
.side-foot label button { font: inherit; font-size: 11px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.side-foot input { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--side-border); background: var(--input-bg); color: var(--text); outline: none; }
.token-state { font-size: 11px; color: var(--side-muted); margin-top: 3px; }
.token-state.set { color: var(--opt); }

/* Method badges */
.m { display: inline-block; min-width: 54px; text-align: center; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; }
.m.GET { background: var(--get); } .m.POST { background: var(--post); } .m.PUT { background: var(--put); } .m.DELETE { background: var(--delete); }
.nav-item .m { min-width: 48px; font-size: 10px; }

/* Main */
main { flex: 1; height: 100vh; overflow-y: auto; }
.topbar { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 28px; display: flex; justify-content: space-between; align-items: center; }
.topbar .crumbs { color: var(--muted); }
.btn { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.content { max-width: 1050px; padding: 24px 28px 60px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 18px; }
.endpoint-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.endpoint-head .path { font-family: Consolas, monospace; font-size: 17px; font-weight: 600; }
.endpoint-head .m { font-size: 13px; padding: 4px 10px; }
.access { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.access.public { color: var(--opt); border-color: currentColor; }
.access.guarded { color: var(--no); border-color: currentColor; }
h2 { margin: 0 0 6px; font-size: 22px; color: var(--brand); }
h3 { margin: 18px 0 8px; font-size: 15px; }
p { margin: 6px 0; }
ol, ul { margin: 6px 0; padding-left: 22px; }
li { margin: 3px 0; }
.muted { color: var(--muted); }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.note { border-left: 4px solid var(--delete); background: var(--err-bg); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }
.info { border-left: 4px solid var(--accent); background: var(--code-bg); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }

table { width: 100%; border-collapse: collapse; margin: 6px 0; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 2px solid var(--border); padding: 6px 8px; }
td { border-bottom: 1px solid var(--border); padding: 7px 8px; vertical-align: top; }
td.field { font-family: Consolas, monospace; font-weight: 600; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.tag.required { color: var(--req); } .tag.optional { color: var(--opt); } .tag.not-allowed { color: var(--no); } .tag.path { color: var(--path); } .tag.query { color: var(--get); }

/* Try it out */
.try { display: grid; gap: 10px; }
.try label { font-weight: 600; font-size: 13px; }
/* Path parameter label: the tag's bottom edge sits on the same line as the bottom of the field name */
.try .param-label { display: inline-flex; align-items: flex-end; gap: 6px; line-height: 1.25; margin-bottom: 4px; }
.try .param-label .tag { line-height: 1.25; padding: 0 8px; }
.try input.mono { width: 220px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
textarea { width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); color: var(--text); font-size: 13px; resize: vertical; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.response { margin-top: 6px; }
.status { display: inline-flex; gap: 10px; align-items: center; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.status.ok { background: var(--ok-bg); color: var(--opt); }
.status.err { background: var(--err-bg); color: var(--req); }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
/* Responses table */
.responses td { vertical-align: top; }
.responses td:first-child { width: 64px; } .responses td:nth-child(2) { width: 130px; white-space: nowrap; }
.responses pre, .responses td > p { margin: 0; }
.code { display: inline-block; min-width: 42px; text-align: center; font-weight: 700; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
.code.ok { background: var(--ok-bg); color: var(--opt); } .code.err { background: var(--err-bg); color: var(--req); }
details summary { cursor: pointer; }
details[open] summary { margin-bottom: 6px; }
a { color: var(--accent); }
.copy-row { display: flex; justify-content: space-between; align-items: center; }
.hidden { display: none; }

@media (max-width: 820px) {
  body { flex-direction: column; }
  aside { width: 100%; flex: none; height: auto; position: static; }
  nav { max-height: 40vh; }
  main { height: auto; }
  .content { padding: 16px; }
  .topbar { padding: 10px 16px; }
}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1>NexHome API</h1>
    <small>Interactive reference</small>
  </div>
  <div class="search"><input id="search" type="search" placeholder="Filter endpoints..." aria-label="Filter endpoints"></div>
  <nav id="nav" aria-label="Endpoints"></nav>
  <div class="side-foot">
    <div>
      <label for="baseUrl">Server</label>
      <input id="baseUrl" class="mono" spellcheck="false">
    </div>
    <div>
      <label for="accessToken"><span>Access token</span><button type="button" id="clearTokens" title="Forget the saved tokens">Clear</button></label>
      <input id="accessToken" class="mono" spellcheck="false" placeholder="Filled in after Verify OTP">
      <div class="token-state" id="tokenState"></div>
    </div>
  </div>
</aside>

<main id="main">
  <div class="topbar">
    <div class="crumbs" id="crumbs">Overview</div>
    <button class="btn small" id="themeBtn" type="button" title="Toggle light/dark">Theme</button>
  </div>
  <div class="content" id="content"></div>
</main>

<script>
// ---------------------------------------------------------------------------------------------
// API definition. Keep in sync with the controllers and DTOs.
// req: "required" | "optional" | "not-allowed" | "path"
// access: "public" | "token" (any signed-in user) | "<FUNCTION_CODE> <READ|WRITE|DELETE>" (role function check)
// ---------------------------------------------------------------------------------------------
const R = "required", O = "optional", N = "not-allowed", P = "path", Q = "query";
const DATE = "Sun, 25 Oct 2026 22:30:00 IST";
// Seeded ids in a fresh database: roles SUPER_USER 1, ADMIN 2, SUB_ADMIN 3, CUSTOMER 4, PARTNER 5;
// lookup types ACCOUNT_STATUS 1, FUNCTION_TYPE 2. Ids of records you create are in their create responses.
const SUPER_USER_MOBILE = "8897182017";
const REFRESH_PLACEHOLDER = "<paste refreshToken from Verify OTP>";

const ROLE_SUPER_USER = { roleId: 1, roleCode: "SUPER_USER", roleName: "Super User", isActive: true, assignedAt: DATE };
const ROLE_ADMIN = { roleId: 2, roleCode: "ADMIN", roleName: "Admin", isActive: true, assignedAt: DATE };
const ROLE_CUSTOMER = { roleId: 4, roleCode: "CUSTOMER", roleName: "Customer", isActive: true, assignedAt: DATE };
const SUPER_USER_RESPONSE = { userId: 13, countryCode: "+91", mobileNumber: SUPER_USER_MOBILE, email: null, profilePhotoUrl: null,
  accountStatus: "ACTIVE", accountVerifiedDate: DATE, lastLoginAt: DATE, roles: [ROLE_SUPER_USER], creationDate: DATE };
const ADMIN_RESPONSE = { userId: 20, countryCode: "+91", mobileNumber: "9123456780", email: "priya.admin@nexhome.in",
  profilePhotoUrl: null, accountStatus: "ACTIVE", accountVerifiedDate: null, lastLoginAt: null, roles: [ROLE_ADMIN], creationDate: DATE };
const TOKENS = { tokenType: "Bearer", accessToken: "eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJuZXhob21lIiwic3ViIjoiMTMiLCJyb2xlcyI6WyJTVVBFUl9VU0VSIl19.Xb1...",
  accessTokenExpiresAt: "Sun, 25 Oct 2026 22:45:00 IST", refreshToken: "kQ2v8mJ3oP1rT6yW0zX4cA7eG9iL5nB2dF8hK3jM0qS",
  refreshTokenExpiresAt: "Tue, 24 Nov 2026 22:30:00 IST" };
const OTP_PENDING = { otpRequestId: 31, countryCode: "+91", mobileNumber: SUPER_USER_MOBILE, purpose: "LOGIN",
  requestStatus: "PENDING", expiresAt: "Sun, 25 Oct 2026 22:35:00 IST", verifiedAt: null, user: null, tokens: null };
const OTP_VERIFIED = { ...OTP_PENDING, requestStatus: "VERIFIED", verifiedAt: DATE, user: SUPER_USER_RESPONSE, tokens: TOKENS };
const LOOKUP_TYPE_RESPONSE = { lookupTypeId: 44, typeCode: "PREFERRED_CONTACT_LANGUAGE", typeName: "Preferred Contact Language",
  description: "Languages a partner can be contacted in", activeFlag: true, isSystemManaged: false, creationDate: DATE };
const LOOKUP_VALUE_RESPONSE = { lookupValueId: 260, lookupTypeId: 44, typeCode: "PREFERRED_CONTACT_LANGUAGE", valueCode: "te",
  displayName: "Telugu", description: null, displayOrder: 1, activeFlag: true, isDefault: true,
  metadata: { nativeName: "తెలుగు" }, creationDate: DATE };
const ACCOUNT_STATUS_VALUES = ["ACTIVE", "SUSPENDED", "BLOCKED", "DEACTIVATED"].map((code, i) => ({ lookupValueId: i + 1, lookupTypeId: 1,
  typeCode: "ACCOUNT_STATUS", valueCode: code, displayName: code.charAt(0) + code.slice(1).toLowerCase(), description: null,
  displayOrder: i + 1, activeFlag: true, isDefault: false, metadata: {}, creationDate: DATE }));
const ROLE_RESPONSE = { roleId: 6, code: "SUPPORT_AGENT", name: "Support Agent", description: "Handles customer support tickets",
  activeFlag: true, creationDate: DATE };
const FUNCTION_RESPONSE = { functionId: 6, functionModule: "SUPPORT", functionCode: "SUPPORT_TICKET_MANAGE",
  functionName: "Manage Support Tickets", functionType: "FEATURE", description: "View and answer support tickets",
  activeFlag: true, creationDate: DATE };
const ROLE_FUNCTION_RESPONSE = { roleFunctionId: 7, roleId: 6, roleCode: "SUPPORT_AGENT", functionId: 6,
  functionCode: "SUPPORT_TICKET_MANAGE", functionName: "Manage Support Tickets", canRead: true, canWrite: true, canDelete: false,
  activeFlag: true, creationDate: DATE };
const STATUS_TEXT = { 200: "OK", 201: "Created", 204: "No Content", 400: "Bad Request", 401: "Unauthorized", 403: "Forbidden",
  404: "Not Found", 409: "Conflict", 429: "Too Many Requests" };
const NOT_ACTIVE = "This account is not active.";
const NO_PENDING = "No pending OTP for this mobile number. Request a new one.";

const LIST_ERRORS = [[400, "Page must be 0 or more."], [400, "Size must be between 1 and 100."],
  [400, "Account status must be one of: ACTIVE, SUSPENDED, BLOCKED, DEACTIVATED."], [400, "Parameter page has an invalid value."]];
// Error responses of each endpoint: [status, message]. Messages are the server's exact text.
// 401 (no or bad token) and 403 (missing permission) are added automatically from the endpoint's access.
const ERRORS = {
  "auth-register": [[400, "Mobile number must be 6 to 15 digits"], [400, "Role must be CUSTOMER or PARTNER"],
    [404, "Role Not Found or Inactive"], [409, "An account already exists with this mobile number. Log in instead."],
    [409, "An account already exists with this email"]],
  "auth-otp-request": [[400, "Purpose must be one of: LOGIN, REGISTRATION, PHONE_CHANGE, SERVICE_START, SERVICE_COMPLETION."],
    [400, "Use the phone change endpoints to change a mobile number."], [400, NOT_ACTIVE],
    [400, "This mobile number is already verified. Log in instead."], [404, "No account exists with this mobile number."],
    [429, "Please wait before requesting another OTP."]],
  "auth-otp-verify": [[400, "OTP must be 4 to 8 digits"], [400, NO_PENDING], [400, "OTP is incorrect."],
    [400, "Too many wrong attempts. Request a new OTP."], [400, "OTP has expired. Request a new one."], [400, NOT_ACTIVE]],
  "auth-refresh": [[400, "Refresh token is required"], [401, "The refresh token is invalid or has expired."], [401, NOT_ACTIVE]],
  "auth-logout": [[400, "Refresh token is required"]],
  "auth-logout-all": [],
  "auth-phone-request": [[400, NOT_ACTIVE], [409, "An account already exists with this mobile number"],
    [429, "Please wait before requesting another OTP."]],
  "auth-phone-verify": [[400, NO_PENDING], [400, "OTP is incorrect."], [400, "OTP has expired. Request a new one."],
    [409, "An account already exists with this mobile number"]],
  "users-create": [[400, "Mobile number must be 6 to 15 digits"], [400, "Role is required"],
    [404, "Role Not Found or Inactive"], [409, "An account already exists with this mobile number"],
    [409, "An account already exists with this email"]],
  "users-me": [],
  "users-customers": LIST_ERRORS, "users-partners": LIST_ERRORS, "users-admins": LIST_ERRORS, "users-sub-admins": LIST_ERRORS, "users-super-users": LIST_ERRORS,
  "users-get": [[404, "User does not exist."]],
  "users-update": [[400, "Mobile number can only be changed with a phone change OTP"], [400, "Account status cannot be updated here"],
    [404, "User does not exist."], [409, "An account already exists with this email"]],
  "users-status": [[400, "Account status must be one of: ACTIVE, SUSPENDED, BLOCKED, DEACTIVATED."], [400, "User is already ACTIVE."],
    [400, "You cannot change your own account status."], [404, "User does not exist."]],
  "users-roles-assign": [[404, "User does not exist."], [404, "Role Not Found or Inactive"], [409, "User already has this role"]],
  "users-roles-update": [[400, "Active flag is required"], [400, "An inactive role cannot be activated for a user."],
    [404, "User does not have this role."]],
  "lookup-types-create": [[400, "Type code must contain only capital letters, digits and underscores, starting with a letter"],
    [409, "Lookup type code already exists"]],
  "lookup-types-update": [[400, "Type code cannot be updated"], [400, "A system managed lookup type cannot be deactivated."],
    [404, "Lookup type does not exist."]],
  "lookup-types-list": [],
  "lookup-type-values": [[404, "Lookup type does not exist."]],
  "lookup-values-add": [[400, "Value code must contain only letters, digits, underscores, dots and hyphens"],
    [400, "An inactive lookup value cannot be the default."], [404, "Lookup type does not exist."],
    [409, "Value code already exists for this lookup type"]],
  "lookup-values-update": [[400, "Value code cannot be updated"], [400, "Values of a system managed lookup type cannot be deactivated."],
    [400, "An inactive lookup value cannot be the default."], [404, "Lookup value does not exist."]],
  "lookup-values-dropdown": [[404, "Lookup type does not exist or is inactive."]],
  "roles-create": [[400, "Role code must contain only capital letters, digits and underscores, starting with a letter"],
    [409, "Role code already exists"]],
  "roles-update": [[400, "Role code cannot be updated"], [400, "Role name cannot be blank"], [404, "Role does not exist."]],
  "roles-delete": [[404, "Role does not exist."], [409, "Role is assigned to users or functions; deactivate it instead."]],
  "role-functions-add": [[400, "Role is required"], [404, "Role does not exist."], [404, "Function does not exist."],
    [409, "Function is already assigned to this role"]],
  "role-functions-update": [[400, "Function cannot be updated"], [404, "Role function does not exist."]],
  "role-functions-delete": [[404, "Role function does not exist."]],
  "functions-create": [[400, "Function type must be one of: MODULE, SCREEN, FEATURE, API, ACTION."],
    [400, "Function code must contain only capital letters, digits and underscores, starting with a letter"],
    [409, "Function code already exists"]],
  "functions-update": [[400, "Function code cannot be updated"], [404, "Function does not exist."]],
  "functions-delete": [[404, "Function does not exist."], [409, "Function is assigned to roles; deactivate it instead."]]
};

const PHONE_RULES = [["countryCode", "string", R, "+ followed by 1 to 4 digits, e.g. +91."],
  ["mobileNumber", "string", R, "6 to 15 digits, no spaces."]];

const LIST_PARAMS = [
  ["page", "number", Q, "Zero-based page number; default 0."],
  ["size", "number", Q, "Users per page, 1 to 100; default 10."],
  ["accountStatus", "string", Q, "Only users with this status: ACTIVE, SUSPENDED, BLOCKED or DEACTIVATED."],
  ["search", "string", Q, "Part of the mobile number or email, e.g. 98765."]];
const CUSTOMER_RESPONSE = { userId: 21, countryCode: "+91", mobileNumber: "9876543210", email: "ravi.kumar@example.com",
  profilePhotoUrl: null, accountStatus: "ACTIVE", accountVerifiedDate: DATE, lastLoginAt: DATE, roles: [ROLE_CUSTOMER], creationDate: DATE };
const userPage = (user) => ({ content: [user], page: 0, size: 10, totalElements: 1, totalPages: 1 });

const API = [  { group: "Authentication", items: [
    { id: "auth-register", method: "POST", path: "/api/auth/register", title: "Sign up (customer / partner)", success: 201, access: "public",
      desc: "Creates an ACTIVE account for a new mobile number with the CUSTOMER or PARTNER role and sends a <b>REGISTRATION</b> OTP. Then call <a href=\"#auth-otp-verify\">Verify OTP</a> with purpose <code>REGISTRATION</code>, which verifies the number and signs the user in. Staff accounts are created by an admin with <a href=\"#users-create\">Create user</a>.",
      params: [...PHONE_RULES,
        ["email", "string", O, "Valid email with a dotted domain; stored lower-case; must be unused (409)."],
        ["roleCode", "string", R, "CUSTOMER or PARTNER."]],
      example: { countryCode: "+91", mobileNumber: "9876543210", email: "ravi.kumar@example.com", roleCode: "CUSTOMER" },
      returns: { ...OTP_PENDING, otpRequestId: 32, mobileNumber: "9876543210", purpose: "REGISTRATION" } },
    { id: "auth-otp-request", method: "POST", path: "/api/auth/otp/request", title: "Request OTP", success: 201, access: "public",
      desc: "Sends a 6-digit OTP, valid for 5 minutes. <b>LOGIN</b> needs an existing ACTIVE account; <b>REGISTRATION</b> resends the sign-up OTP while the number is unverified. A new OTP replaces the pending one; wait 60 seconds between requests. <br><b>No SMS provider yet:</b> with the <code>dev</code> profile the OTP is printed in the backend log as <code>OTP &lt;id&gt; for +91 &lt;number&gt; (LOGIN): &lt;otp&gt;</code>.",

const LABEL = { required: "Required", optional: "Optional", "not-allowed": "Not allowed", path: "Path", query: "Query" };

// ------------------------------------------------- helpers
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); } catch { /* storage unavailable */ } }
};
// The page is usually served by something other than the backend (e.g. IntelliJ on port 63342), so its own
// origin is not a sensible default
function defaultBaseUrl() {
  return "http://localhost:8080";
}
function baseUrl() { return ($("#baseUrl").value || defaultBaseUrl()).replace(/\/+$/, ""); }
const isPublic = (e) => e.access === "public";
const accessToken = () => $("#accessToken").value.trim();

// ------------------------------------------------- tokens
function saveTokens(access, refresh) {
  $("#accessToken").value = access || "";
  store.set("nexhome.accessToken", access || "");
  store.set("nexhome.refreshToken", refresh || "");
  showTokenState();
}
function showTokenState() {
  const state = $("#tokenState");
  const refresh = store.get("nexhome.refreshToken");
  if (!accessToken()) { state.className = "token-state"; state.textContent = "Not signed in: log in with Request OTP + Verify OTP."; return; }
  let who = "";
  try { who = " as user " + JSON.parse(atob(accessToken().split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).sub; } catch { /* not a JWT */ }
  state.className = "token-state set";
  state.textContent = `Signed in${who}.` + (refresh ? " Refresh token saved." : "");
}
// Request examples use the saved refresh token instead of the placeholder
function exampleFor(e) {
  if (!e.example) return undefined;
  const refresh = store.get("nexhome.refreshToken");
  return e.example.refreshToken === REFRESH_PLACEHOLDER && refresh ? { ...e.example, refreshToken: refresh } : e.example;
}

// ------------------------------------------------- navigation
function renderNav(filter = "") {
  const f = filter.trim().toLowerCase();
  const current = location.hash.slice(1);
  let html = `<a class="nav-item ${current === "" || current === "overview" ? "active" : ""}" href="#overview"><span class="label">Overview &amp; quick start</span></a>`
    + `<a class="nav-item ${current === "errors" ? "active" : ""}" href="#errors"><span class="label">Error responses</span></a>`;
  for (const g of API) {
    const items = g.items.filter(e => !f || (e.title + " " + e.path + " " + e.method).toLowerCase().includes(f));
    if (!items.length) continue;
    // A service is open when the user opened it, while filtering, or when it holds the endpoint being viewed
    const open = f !== "" || g.group === openGroup;
    html += `<button type="button" class="group-toggle ${open ? "open" : ""}" data-group="${esc(g.group)}" aria-expanded="${open}">`
      + `<span>${esc(g.group)}</span><span class="count">${items.length}</span><span class="chevron" aria-hidden="true"></span></button>`
      + `<div class="group-items ${open ? "" : "collapsed"}">`;
    for (const e of items) {
      html += `<a class="nav-item ${current === e.id ? "active" : ""}" href="#${e.id}" title="${esc(e.method + " " + e.path)}">`
        + `<span class="m ${e.method}">${e.method}</span><span class="label">${esc(e.title)}</span></a>`;
    }
    html += `</div>`;
  }
  $("#nav").innerHTML = html;
}

// The one service open in the sidebar (accordion), remembered between visits
let openGroup = store.get("nexhome.openGroup") || null;
function setOpenGroup(group) {
  openGroup = group;
  store.set("nexhome.openGroup", group || "");
}
$("#nav").addEventListener("click", (event) => {
  const toggle = event.target.closest(".group-toggle");
  if (!toggle) return;
  const group = toggle.dataset.group;
  const willOpen = toggle.getAttribute("aria-expanded") !== "true";
  setOpenGroup(willOpen ? group : null);
  // Opening one service closes every other
  for (const other of document.querySelectorAll(".group-toggle")) {
    const open = willOpen && other === toggle;
    other.classList.toggle("open", open);
    other.setAttribute("aria-expanded", String(open));
    other.nextElementSibling.classList.toggle("collapsed", !open);
  }
});

// ------------------------------------------------- pages
function overviewPage() {
  $("#crumbs").textContent = "Overview";
  return `<div class="card">
    <h2>NexHome API</h2>
    <p>Every endpoint takes and returns JSON. Pick an endpoint on the left, read its parameters, then use <b>Try it out</b> to call the server set at the bottom of the sidebar.</p>
    <h3>Quick start: log in as the super user</h3>
    <ol>
      <li>Start the backend with the <code>dev</code> profile.</li>
      <li><a href="#auth-otp-request">Request OTP</a> with <code>{"countryCode": "+91", "mobileNumber": "${SUPER_USER_MOBILE}", "purpose": "LOGIN"}</code>.</li>
      <li>Copy the OTP from the backend log line <code>OTP &lt;id&gt; for +91 ${SUPER_USER_MOBILE} (LOGIN): &lt;otp&gt;</code> (there is no SMS provider yet).</li>
      <li><a href="#auth-otp-verify">Verify OTP</a> with that OTP. The access token is saved in the sidebar and sent with every request from then on.</li>
      <li>After 15 minutes the access token expires (401): run <a href="#auth-refresh">Refresh tokens</a>, which uses the saved refresh token.</li>
    </ol>
    <div class="info">Open this page through IntelliJ (right-click <code>api-docs.html</code> &gt; Open In &gt; Browser), not by double-clicking the file: browsers block API calls from <code>file://</code> pages. With the <code>dev</code> profile the backend accepts every <code>http://localhost</code> port; other environments must list the page's origin in <code>CORS_ALLOWED_ORIGINS</code>. <b>Copy as curl</b> always works.</div>
    <h3>Access</h3>
    <table><tr><th>Mark</th><th>Meaning</th></tr>
      <tr><td><span class="access public">Public</span></td><td>No token needed</td></tr>
      <tr><td><span class="access">Signed in</span></td><td>Any valid access token (<code>Authorization: Bearer &lt;token&gt;</code>); otherwise 401</td></tr>
      <tr><td><span class="access guarded">USER_MANAGE WRITE</span></td><td>One of your active roles must grant this function and flag (role functions); otherwise 403. SUPER_USER always may. Seeded: ADMIN has lookups and users read/write, staff (admin lists) read and roles/functions read; SUB_ADMIN has lookups and users read.</td></tr>
    </table>
    <h3>Field marks</h3>
    <table><tr><th>Mark</th><th>Meaning</th></tr>
      <tr><td><span class="tag required">Required</span></td><td>Must be sent and non-blank; missing gives 400</td></tr>
      <tr><td><span class="tag optional">Optional</span></td><td>May be left out</td></tr>
      <tr><td><span class="tag not-allowed">Not allowed</span></td><td>Must not be sent; sending it gives 400 (fields that can never change here)</td></tr>
      <tr><td><span class="tag path">Path</span></td><td>Part of the URL, not the body</td></tr>
    </table>
    <h3>Update rules (PUT)</h3>
    <ul>
      <li>Send only the fields you want to change. A missing or <code>null</code> field keeps its current value, except <code>description</code> fields, which are always replaced.</li>
      <li>A required field can be left out of an update but cannot be blanked.</li>
      <li><code>""</code> clears an optional text field such as <code>email</code>.</li>
      <li>Nothing that other data refers to is deleted: deactivate it, or set a user's status to DEACTIVATED.</li>
    </ul>
    <p class="muted">Success codes: create/add 201, read/update 200, delete/logout 204. Dates look like <code>${DATE}</code>.</p>
  </div>`;
}

function errorsPage() {
  $("#crumbs").textContent = "Error responses";
  return `<div class="card">
    <h2>Error responses</h2>
    <p>Every error returns the same body. Validation errors list each invalid field's message, separated by commas.</p>
    <pre>${esc(JSON.stringify({ path: "/api/users/create", method: "POST", statusCode: 400, error: "Bad Request",
      message: "Mobile number must be 6 to 15 digits, Role is required", timestamp: DATE }, null, 2))}</pre>
    <table><tr><th>Status</th><th>When</th></tr>
      <tr><td>400 Bad Request</td><td>A required field is missing or invalid, a Not allowed field was sent, the JSON is malformed, an OTP is wrong or expired, or a rule failed</td></tr>
      <tr><td>401 Unauthorized</td><td>No access token, or it is invalid or expired (<i>The access token is invalid or has expired.</i>); its session was logged out, ended by refresh-token reuse, or the account left ACTIVE (<i>The session has ended. Log in again.</i>); or a refresh token is invalid, used or expired</td></tr>
      <tr><td>403 Forbidden</td><td>Signed in, but none of your roles grants the function, your account is not ACTIVE, or the action needs a super user</td></tr>
      <tr><td>404 Not Found</td><td>The record does not exist, or the URL is wrong (unknown URLs give 401 without a token)</td></tr>
      <tr><td>405 Method Not Allowed</td><td>Wrong HTTP method for the URL</td></tr>
      <tr><td>409 Conflict</td><td>A duplicate (mobile number, email, codes, role + function pair) or a record still in use</td></tr>
      <tr><td>415 Unsupported Media Type</td><td>Content-Type is not application/json</td></tr>
      <tr><td>429 Too Many Requests</td><td>Another OTP was requested within 60 seconds</td></tr>
      <tr><td>500 Internal Server Error</td><td>An unexpected server error</td></tr>
    </table>
  </div>`;
}

function accessBadge(e) {
  if (isPublic(e)) return `<span class="access public">Public</span>`;
  if (e.access === "token") return `<span class="access">Signed in</span>`;
  return `<span class="access guarded" title="Role function needed">${esc(e.access)}</span>`;
}

// Success response with its body, then every error with its message and the full error body on demand
function responsesTable(e) {
  const code = (status) => `<span class="code ${status < 300 ? "ok" : "err"}">${status}</span>`;
  const success = typeof e.returns === "string"
    ? `<p class="muted">${esc(e.returns)}</p>`
    : `<pre>${esc(JSON.stringify(e.returns, null, 2))}</pre>`;
  const errors = [...(ERRORS[e.id] || [])];
  if (!isPublic(e)) errors.push([401, "Authentication is required."], [401, "The session has ended. Log in again."]);
  if (!isPublic(e) && e.access !== "token") errors.push([403, "You do not have permission to perform this action."]);
  errors.sort((a, b) => a[0] - b[0]);
  const rows = errors.map(([status, message]) => {
    const example = { path: e.path.replace(/\{(\w+)\}/, (_, name) => (e.pathDefaults && e.pathDefaults[name]) || "1"), method: e.method,
      statusCode: status, error: STATUS_TEXT[status], message, timestamp: DATE };
    return `<tr><td>${code(status)}</td><td>${esc(STATUS_TEXT[status])}</td><td>
      <details><summary>${esc(message)}</summary><pre>${esc(JSON.stringify(example, null, 2))}</pre></details></td></tr>`;
  }).join("");
  return `<table class="responses"><tr><th>Code</th><th>Status</th><th>Body</th></tr>
    <tr><td>${code(e.success)}</td><td>${esc(STATUS_TEXT[e.success])}</td><td>${success}</td></tr>${rows}</table>
    ${e.example ? `<p class="muted">Validation errors list every invalid field's message, joined with commas. See <a href="#errors">Error responses</a>.</p>` : ""}`;
}

function endpointPage(e) {
  $("#crumbs").innerHTML = `${esc(e.group)} &rsaquo; ${esc(e.title)}`;
  const pathParams = e.params.filter(p => p[2] === P);
  const queryParams = e.params.filter(p => p[2] === Q);
  const rows = e.params.map(([name, type, req, rule]) =>
    `<tr><td class="field">${esc(name)}</td><td>${esc(type)}</td><td><span class="tag ${req}">${LABEL[req]}</span></td><td>${esc(rule)}</td></tr>`).join("");
  const example = exampleFor(e);
  const body = example ? JSON.stringify(example, null, 2) : "";
  const paramsSection = e.params.length
    ? `<h3>${pathParams.length || queryParams.length ? "Parameters" : "Request body"}</h3>
       <table><tr><th>Field</th><th>Type</th><th>Required?</th><th>Rules</th></tr>${rows}</table>`
    : `<h3>Request</h3><p class="muted">No parameters or body.</p>`;
  return `<div class="card">
    <div class="endpoint-head"><span class="m ${e.method}">${e.method}</span><span class="path">${esc(e.path)}</span>${accessBadge(e)}</div>
    <h2 style="margin-top:12px">${esc(e.title)}</h2>
    <p>${e.desc}</p>
    ${e.danger ? `<div class="note">${esc(e.danger)}</div>` : ""}
    ${paramsSection}
    <h3>Responses</h3>
    ${responsesTable(e)}
  </div>
  <div class="card">
    <h3 style="margin-top:0">Try it out</h3>
    <div class="try">
      ${!isPublic(e) && !accessToken() ? `<div class="note">Not signed in: this call will get 401. Log in first with <a href="#auth-otp-request">Request OTP</a> and <a href="#auth-otp-verify">Verify OTP</a>.</div>` : ""}
      ${pathParams.map(([name]) => `<div><label class="param-label" for="pp-${name}"><span>${esc(name)}</span><span class="tag path">Path</span></label><br>
        <input class="mono" id="pp-${name}" data-path-param="${name}" placeholder="e.g. 1" value="${esc((e.pathDefaults && e.pathDefaults[name]) || "")}"></div>`).join("")}
      ${queryParams.map(([name, , , rule]) => `<div><label class="param-label" for="qp-${name}"><span>${esc(name)}</span><span class="tag query">Query</span></label><br>
        <input class="mono" id="qp-${name}" data-query-param="${name}" placeholder="optional" title="${esc(rule)}" value="${esc((e.queryDefaults && e.queryDefaults[name]) || "")}"></div>`).join("")}
      ${example ? `<div class="copy-row"><label for="body">Request body</label>
        <button class="btn small" type="button" id="resetBody">Reset example</button></div>
        <textarea id="body" spellcheck="false" rows="${body.split("\n").length + 1}">${esc(body)}</textarea>` : ""}
      <div class="actions">
        <button class="btn primary" type="button" id="execute">Execute</button>
        <button class="btn" type="button" id="showCurl">Copy as curl</button>
        ${!isPublic(e) && accessToken() ? `<span class="muted">Sends the access token from the sidebar.</span>` : ""}
      </div>
      <div id="curlBox" class="hidden"><pre id="curl"></pre></div>
      <div class="response" id="response"></div>
    </div>
  </div>`;
}

function render() {
  const id = location.hash.slice(1) || "overview";
  const e = ALL.find(x => x.id === id);
  if (e) setOpenGroup(e.group);
  $("#content").innerHTML = id === "errors" ? errorsPage() : e ? endpointPage(e) : overviewPage();
  renderNav($("#search").value);
  $("#main").scrollTop = 0;
  if (e) wireEndpoint(e);
}

// ------------------------------------------------- try it out
function buildUrl(e) {
  let path = e.path;
  for (const input of document.querySelectorAll("[data-path-param]")) {
    const value = input.value.trim();
    if (!value) throw new Error(`Enter ${input.dataset.pathParam}.`);
    path = path.replace(`{${input.dataset.pathParam}}`, encodeURIComponent(value));
  }
  // Empty query inputs are left out
  const query = [...document.querySelectorAll("[data-query-param]")]
    .filter(input => input.value.trim() !== "")
    .map(input => `${encodeURIComponent(input.dataset.queryParam)}=${encodeURIComponent(input.value.trim())}`)
    .join("&");
  return baseUrl() + path + (query ? "?" + query : "");
}

function readBody() {
  const area = $("#body");
  if (!area) return undefined;
  const text = area.value.trim();
  if (!text) return undefined;
  try { JSON.parse(text); } catch (err) { throw new Error("Request body is not valid JSON: " + err.message); }
  if (text.includes(REFRESH_PLACEHOLDER)) throw new Error("Paste a refresh token first (or log in with Verify OTP, which saves it).");
  return text;
}

// Public endpoints get no Authorization header: a stale token would be rejected even there
function headersFor(e, body) {
  const headers = { Accept: "application/json" };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (!isPublic(e) && accessToken()) headers.Authorization = "Bearer " + accessToken();
  return headers;
}

function curlFor(e, url, body) {
  let cmd = `curl -X ${e.method} "${url}"`;
  if (!isPublic(e)) cmd += ` \\\n  -H "Authorization: Bearer ${accessToken() || "<access token>"}"`;
  if (body !== undefined) cmd += ` \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(JSON.parse(body))}'`;
  return cmd;
}

function wireEndpoint(e) {
  const reset = $("#resetBody");
  if (reset) reset.onclick = () => { $("#body").value = JSON.stringify(exampleFor(e), null, 2); };

  $("#showCurl").onclick = async () => {
    try {
      const cmd = curlFor(e, buildUrl(e), readBody());
      $("#curl").textContent = cmd;
      $("#curlBox").classList.remove("hidden");
      try { await navigator.clipboard.writeText(cmd); $("#showCurl").textContent = "Copied"; setTimeout(() => $("#showCurl").textContent = "Copy as curl", 1500); }
      catch { /* clipboard unavailable: the command is shown instead */ }
    } catch (err) { showResponse({ error: err.message }); }
  };

  $("#execute").onclick = async () => {
    let url, body;
    try { url = buildUrl(e); body = readBody(); } catch (err) { return showResponse({ error: err.message }); }
    if (e.danger && !confirm(e.danger + "\n\nContinue?")) return;
    const button = $("#execute");
    button.disabled = true; button.textContent = "Running...";
    const started = performance.now();
    try {
      const res = await fetch(url, { method: e.method, headers: headersFor(e, body), body });
      const ms = Math.round(performance.now() - started);
      const text = await res.text();
      let pretty = text, json = null;
      try { json = text ? JSON.parse(text) : null; pretty = json ? JSON.stringify(json, null, 2) : ""; } catch { /* not JSON */ }
      let saved = "";
      if (res.ok && e.savesTokens && json) {
        const tokens = e.savesTokens === "root" ? json : json.tokens;
        if (tokens && tokens.accessToken) { saveTokens(tokens.accessToken, tokens.refreshToken); saved = "Tokens saved: protected endpoints will use them."; }
      }
      if (res.ok && e.clearsTokens) { saveTokens("", ""); saved = "Signed out: saved tokens cleared."; }
      // Every NexHome response is JSON; anything else came from another server
      if (!res.ok && !(json && "statusCode" in json)) {
        saved = `This response did not come from the NexHome backend. Check the Server field in the sidebar (usually http://localhost:8080).`;
      }
      showResponse({ status: res.status, statusText: res.statusText, ok: res.ok, ms, url, body: pretty, saved });
    } catch (err) {
      showResponse({ error: location.protocol === "file:"
        ? "This page was opened as a file, which browsers do not let call the API. Open it through IntelliJ instead (right-click api-docs.html > Open In > Browser), or use Copy as curl."
        : `Could not reach ${baseUrl()}. Is the backend running with the dev profile, and is this page's origin (${location.origin}) allowed by CORS_ALLOWED_ORIGINS? (${err.message})` });
    } finally {
      button.disabled = false; button.textContent = "Execute";
    }
  };
}

function showResponse(r) {
  const box = $("#response");
  if (r.error) { box.innerHTML = `<div class="status err">${esc(r.error)}</div>`; return; }
  box.innerHTML = `<h3>Response</h3>
    <div class="status ${r.ok ? "ok" : "err"}"><span>${r.status} ${esc(r.statusText || "")}</span><span class="muted" style="font-weight:400">${r.ms} ms</span></div>
    ${r.saved ? `<div class="info">${esc(r.saved)}</div>` : ""}
    <p class="muted" style="margin-top:8px">${esc(r.url)}</p>
    ${r.body ? `<pre>${esc(r.body)}</pre>` : `<p class="muted">No body.</p>`}`;
}

// ------------------------------------------------- setup
// A saved server equal to this page's own origin came from the old default and points at the wrong server
const savedBaseUrl = store.get("nexhome.apiBaseUrl");
$("#baseUrl").value = savedBaseUrl && savedBaseUrl.replace(/\/+$/, "") !== location.origin ? savedBaseUrl : defaultBaseUrl();
$("#baseUrl").addEventListener("change", () => store.set("nexhome.apiBaseUrl", $("#baseUrl").value.trim()));
$("#accessToken").value = store.get("nexhome.accessToken") || "";
$("#accessToken").addEventListener("change", () => { store.set("nexhome.accessToken", accessToken()); showTokenState(); });
$("#clearTokens").onclick = () => { saveTokens("", ""); render(); };
$("#search").addEventListener("input", () => renderNav($("#search").value));
window.addEventListener("hashchange", render);
showTokenState();

const savedTheme = store.get("nexhome.theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  store.set("nexhome.theme", document.documentElement.dataset.theme);
};

render();
</script>
