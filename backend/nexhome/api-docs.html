<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexHome API</title>
<style>
/* Light by default; a softer dark theme only when chosen with the Theme button */
:root {
  --bg: #f7f9fc; --panel: #ffffff; --text: #26303e; --muted: #667085; --border: #e3e8ef;
  --brand: #1e293b; --accent: #0f766e; --code-bg: #f3f5f9;
  --side: #ffffff; --side-text: #344054; --side-muted: #8a94a6; --side-hover: #f2f5f7; --side-active: #e6f4f1; --side-active-text: #0f766e;
  --side-border: #e3e8ef; --input-bg: #f7f9fc;
  --get: #2563eb; --post: #16a34a; --put: #d97706; --delete: #dc2626;
  --req: #dc2626; --opt: #16a34a; --no: #b45309; --path: #475569;
  --ok-bg: #ecfdf3; --err-bg: #fef3f2;
}
:root[data-theme="dark"] {
  --bg: #1f2430; --panel: #282e3b; --text: #e4e7ec; --muted: #a3acbb; --border: #3a4252;
  --brand: #e2e8f0; --accent: #14b8a6; --code-bg: #303747;
  --side: #252b37; --side-text: #d0d5dd; --side-muted: #98a2b3; --side-hover: #2f3644; --side-active: #1f3d3a; --side-active-text: #5eead4;
  --side-border: #3a4252; --input-bg: #1f2430;
  --get: #60a5fa; --post: #22c55e; --put: #f59e0b; --delete: #f87171;
  --req: #f87171; --opt: #4ade80; --no: #fbbf24; --path: #cbd5e1;
  --ok-bg: #1d3528; --err-bg: #3b2526;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--text); background: var(--bg); display: flex; }
code, pre, textarea, input.mono { font-family: Consolas, "Cascadia Mono", "Courier New", monospace; }

/* Sidebar */
aside { width: 300px; flex: 0 0 300px; background: var(--side); color: var(--side-text); border-right: 1px solid var(--side-border); height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; }
.brand { padding: 18px 18px 10px; }
.brand h1 { margin: 0; font-size: 18px; color: var(--brand); }
.brand small { color: var(--side-muted); }
.search { margin: 6px 14px 10px; }
.search input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--side-border); background: var(--input-bg); color: var(--text); outline: none; }
.search input:focus, .side-foot input:focus { border-color: var(--accent); }
.search input::placeholder { color: var(--side-muted); }
nav { overflow-y: auto; padding: 0 8px 16px; flex: 1; }
.group-toggle { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 6px; padding: 9px 10px; border: 0; border-radius: 6px; background: none; color: var(--side-text); font: inherit; font-weight: 600; text-align: left; cursor: pointer; }
.group-toggle:hover { background: var(--side-hover); }
.group-toggle span:first-child { flex: 1; }
.group-toggle .count { font-size: 11px; font-weight: 600; color: var(--side-muted); background: var(--input-bg); border: 1px solid var(--side-border); border-radius: 999px; padding: 0 7px; }
.group-toggle .chevron { width: 8px; height: 8px; border-right: 2px solid var(--side-muted); border-bottom: 2px solid var(--side-muted); transform: rotate(45deg); margin: -4px 4px 0 2px; transition: transform .15s; }
.group-toggle.open .chevron { transform: rotate(-135deg); margin-top: 3px; }
.group-items { padding-left: 6px; margin-bottom: 4px; }
.group-items.collapsed { display: none; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--side-text); text-decoration: none; cursor: pointer; }
.nav-item:hover { background: var(--side-hover); }
.nav-item.active { background: var(--side-active); color: var(--side-active-text); font-weight: 600; }
.nav-item .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-foot { padding: 10px 14px; border-top: 1px solid var(--side-border); font-size: 12px; display: grid; gap: 8px; }
.side-foot label { display: flex; justify-content: space-between; align-items: center; color: var(--side-muted); margin-bottom: 4px; }
.side-foot label button { font: inherit; font-size: 11px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.side-foot input { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--side-border); background: var(--input-bg); color: var(--text); outline: none; }
.token-state { font-size: 11px; color: var(--side-muted); margin-top: 3px; }
.token-state.set { color: var(--opt); }

/* Method badges */
.m { display: inline-block; min-width: 54px; text-align: center; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; }
.m.GET { background: var(--get); } .m.POST { background: var(--post); } .m.PUT { background: var(--put); } .m.DELETE { background: var(--delete); }
.nav-item .m { min-width: 48px; font-size: 10px; }

/* Main */
main { flex: 1; height: 100vh; overflow-y: auto; }
.topbar { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 28px; display: flex; justify-content: space-between; align-items: center; }
.topbar .crumbs { color: var(--muted); }
.btn { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.content { max-width: 1050px; padding: 24px 28px 60px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; margin-bottom: 18px; }
.endpoint-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.endpoint-head .path { font-family: Consolas, monospace; font-size: 17px; font-weight: 600; }
.endpoint-head .m { font-size: 13px; padding: 4px 10px; }
.access { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.access.public { color: var(--opt); border-color: currentColor; }
.access.guarded { color: var(--no); border-color: currentColor; }
.who { margin: 4px 0 8px; padding-left: 20px; }
.who li { margin: 2px 0; }
h2 { margin: 0 0 6px; font-size: 22px; color: var(--brand); }
h3 { margin: 18px 0 8px; font-size: 15px; }
p { margin: 6px 0; }
ol, ul { margin: 6px 0; padding-left: 22px; }
li { margin: 3px 0; }
.muted { color: var(--muted); }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.note { border-left: 4px solid var(--delete); background: var(--err-bg); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }
.info { border-left: 4px solid var(--accent); background: var(--code-bg); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }

table { width: 100%; border-collapse: collapse; margin: 6px 0; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 2px solid var(--border); padding: 6px 8px; }
td { border-bottom: 1px solid var(--border); padding: 7px 8px; vertical-align: top; }
td.field { font-family: Consolas, monospace; font-weight: 600; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.tag.required { color: var(--req); } .tag.optional { color: var(--opt); } .tag.not-allowed { color: var(--no); } .tag.path { color: var(--path); } .tag.query { color: var(--get); }

/* Try it out */
.try { display: grid; gap: 10px; }
.try label { font-weight: 600; font-size: 13px; }
/* Path parameter label: the tag's bottom edge sits on the same line as the bottom of the field name */
.try .param-label { display: inline-flex; align-items: flex-end; gap: 6px; line-height: 1.25; margin-bottom: 4px; }
.try .param-label .tag { line-height: 1.25; padding: 0 8px; }
.try input.mono { width: 220px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
textarea { width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); color: var(--text); font-size: 13px; resize: vertical; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.response { margin-top: 6px; }
.status { display: inline-flex; gap: 10px; align-items: center; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.status.ok { background: var(--ok-bg); color: var(--opt); }
.status.err { background: var(--err-bg); color: var(--req); }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
/* Responses table */
.responses td { vertical-align: top; }
.responses td:first-child { width: 64px; } .responses td:nth-child(2) { width: 130px; white-space: nowrap; }
.responses pre, .responses td > p { margin: 0; }
.code { display: inline-block; min-width: 42px; text-align: center; font-weight: 700; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
.code.ok { background: var(--ok-bg); color: var(--opt); } .code.err { background: var(--err-bg); color: var(--req); }
details summary { cursor: pointer; }
details[open] summary { margin-bottom: 6px; }
a { color: var(--accent); }
.copy-row { display: flex; justify-content: space-between; align-items: center; }
.hidden { display: none; }

@media (max-width: 820px) {
  body { flex-direction: column; }
  aside { width: 100%; flex: none; height: auto; position: static; }
  nav { max-height: 40vh; }
  main { height: auto; }
  .content { padding: 16px; }
  .topbar { padding: 10px 16px; }
}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1>NexHome API</h1>
    <small>Interactive reference</small>
  </div>
  <div class="search"><input id="search" type="search" placeholder="Filter endpoints..." aria-label="Filter endpoints"></div>
  <nav id="nav" aria-label="Endpoints"></nav>
  <div class="side-foot">
    <div>
      <label for="baseUrl">Server</label>
      <input id="baseUrl" class="mono" spellcheck="false">
    </div>
    <div>
      <label for="accessToken"><span>Access token</span><button type="button" id="clearTokens" title="Forget the saved tokens">Clear</button></label>
      <input id="accessToken" class="mono" spellcheck="false" placeholder="Filled in after Verify OTP">
      <div class="token-state" id="tokenState"></div>
    </div>
  </div>
</aside>

<main id="main">
  <div class="topbar">
    <div class="crumbs" id="crumbs">Overview</div>
    <button class="btn small" id="themeBtn" type="button" title="Toggle light/dark">Theme</button>
  </div>
  <div class="content" id="content"></div>
</main>

      desc: "What the signed-in user may do, function by function: the union of the grants of their active roles (active role functions of active functions). A super user gets every active function with full access. An account that is not ACTIVE gets none. The admin console uses it to hide menus without read and actions without write or delete; the backend still checks every request.",

  { group: "Partner onboarding", items: [
    { id: "partners-create", method: "POST", path: "/api/partners/profiles/create", title: "Start partner profile", success: 201, access: "self or PARTNER_ONBOARDING_MANAGE WRITE",
      desc: "Every partner account already has an empty <b>DRAFT</b> profile with its partner id (NHPART0001, ...) from sign-up (V16); this fills it in (verification PENDING, OFFLINE) and keeps the id. A profile that already has a name answers 409. Only the names are required now: save the rest with <a href=\"#partners-update\">Update</a>, then <a href=\"#partners-submit\">Submit</a>. <code>registeredBy</code> is whoever creates it (the partner, or the staff member registering them).",
      params: [["userId", "number", R, "The partner's account."],
        ["firstName", "string", R, "At most 80 characters. " + NAME_RULE],
        ["lastName", "string", R, "At most 80 characters. " + NAME_RULE], ...PARTNER_PARAMS],
      example: { userId: 22, firstName: "Suresh", lastName: "Babu", aadhaarNumber: "234567890123", emergencyContactName: "Lakshmi",
        emergencyContactRelationship: "SPOUSE", emergencyContactNumber: "9000000001" }, returns: PARTNER_DRAFT },
    { id: "partners-update", method: "PUT", path: "/api/partners/profiles/update", title: "Update partner profile", success: 200, access: "owner or PARTNER_ONBOARDING_MANAGE WRITE",
      desc: "Saves profile fields; send only what changes. The partner can edit only while the profile is <b>NOT_STARTED</b>, <b>DRAFT</b> or <b>CHANGES_REQUESTED</b> (the first save makes NOT_STARTED a DRAFT); staff can edit at any time. Once submitted, a profile must stay complete (same checks as Submit).",
      params: [["partnerProfileId", "number", R, "Must exist."], ["firstName", "string", O, NAME_RULE], ["lastName", "string", O, NAME_RULE],
        ...PARTNER_PARAMS, ["userId", "number", N, "The owner never changes."], ["publicId", "string", N, "Never changes."],
        ["onboardingStatus", "string", N, "Use Submit and Review."], ["approvalStatus", "string", N, "Set by Review."],
        ["availabilityStatus", "string", N, "Use Update availability."]],
      example: { partnerProfileId: 3, ...PARTNER_FIELDS }, returns: PARTNER_PROFILE_RESPONSE },
    { id: "partners-submit", method: "PUT", path: "/api/partners/profiles/submit", title: "Submit for review", success: 200, access: "owner or PARTNER_ONBOARDING_MANAGE WRITE",
      desc: "Sends a NOT_STARTED, DRAFT or CHANGES_REQUESTED profile for review: UNDER_REVIEW, verification IN_REVIEW. Needs every required field (the message lists what is missing), at least one service area and availability slot, <code>isAdult: true</code>, and a weekly grid that agrees with <code>weekendAvailability</code> (SATURDAY: Saturday slots and no Sunday; SUNDAY: the reverse; NEITHER: no weekend slots; VARIES: anything).",
      params: [["partnerProfileId", "number", R, "Must exist."]], example: { partnerProfileId: 3 }, returns: PARTNER_SUBMITTED },
    { id: "partners-review", method: "PUT", path: "/api/partners/profiles/review", title: "Review partner profile", success: 200, access: "PARTNER_APPROVE WRITE",
      desc: "Staff decision. From UNDER_REVIEW: APPROVED, REJECTED or CHANGES_REQUESTED (back to the partner for more information or documents, verification PENDING); APPROVED and REJECTED can be sent back as CHANGES_REQUESTED. There is no training or suspension step (suspend the account instead). APPROVED needs <code>isAdult</code> and the three checks: the account (see Verification checks), every document VERIFIED with at least one government ID (<code>documentsVerified</code>) and the primary bank account VERIFIED (<code>bankAccVerified</code>), records <code>approvedBy</code>/<code>approvedAt</code> and sets verification VERIFIED. Anything but APPROVED sets the partner OFFLINE. Nobody can review their own profile (403).",

    { id: "bookings-get", method: "GET", path: "/api/bookings/{bookingId}", title: "Get booking", success: 200, access: "owner or BOOKING_MANAGE READ",

      desc: "Staff: PENDING to CONFIRMED (every booking starts PENDING; an online one is confirmed by its payment), ASSIGNED to PARTNER_EN_ROUTE (shown as \"Partner Accepted\"). The assigned partner: ASSIGNED to PARTNER_EN_ROUTE. Every change writes a history row in the same transaction.",

    { id: "bookings-cancel", method: "PUT", path: "/api/bookings/cancel", title: "Cancel booking", success: 200, access: "owner or BOOKING_MANAGE WRITE",
      desc: "The customer or staff cancel until the work starts (PENDING, CONFIRMED, ASSIGNED, PARTNER_EN_ROUTE). Offers and the partner's assignment end (CANCELLED), so the partner is free again. Cancellation fees and refunds come with Modules 7 and 8.",

    { id: "bookings-offer", method: "POST", path: "/api/bookings/assignments/offer", title: "Offer to partner", success: 201, access: "BOOKING_MANAGE WRITE",
      desc: "A CONFIRMED booking is offered to a partner until the offer runs out: the partner must be approved, offer the service, work then (unless <code>outsideWeeklyHours</code>), not be on time off and have no other booking then (else 400 / 409). No slot is held. <code>startsAt</code> and <code>endsAt</code> (together) allot the slot: they become the booking's scheduled start and end first (400 while other offers are open). An INSTANT booking without them has no times: the partner only has to be approved and offer the service. <code>direct: true</code> assigns at once: ASSIGNED (the booking ASSIGNED); the partner then accepts (ACCEPTED) or declines. A job then goes Started Working (STARTED, the timer's START) and Completed. Several partners may hold offers; the first to accept takes it.",
      params: [["bookingId", "number", R, "A CONFIRMED booking."], ["partnerProfileId", "number", R, "Not already offered it (409)."], ["expiresInMinutes", "number", O, "1 to 60, default 30."], ["direct", "boolean", O, "true: assigned at once."],
        ["outsideWeeklyHours", "boolean", O, "true: reserve the partner even outside their weekly hours (a requested slot); time off and other bookings still block it."],
        ["startsAt", "string", O, "ISO-8601 instant: the allotted slot's start (with endsAt)."], ["endsAt", "string", O, "ISO-8601 instant, after startsAt."]],

    { id: "bookings-respond", method: "PUT", path: "/api/bookings/assignments/respond", title: "Accept or reject offer", success: 200, access: "owner or BOOKING_MANAGE WRITE",

      params: [["assignmentId", "number", R, "An OFFERED assignment, or an ASSIGNED one (accepting makes it ACCEPTED; declining takes the partner off the booking)."], ["accept", "boolean", R, ""], ["rejectionReason", "string", O, "Required to reject."]],
      example: { assignmentId: 4, accept: true }, returns: { ...ASSIGNMENT_RESPONSE, assignmentStatus: "ACCEPTED", respondedAt: DATE } },
    { id: "bookings-assignment-cancel", method: "PUT", path: "/api/bookings/assignments/cancel", title: "Withdraw offer / unassign", success: 200, access: "BOOKING_MANAGE WRITE",
      desc: "Withdraws an OFFERED assignment, or takes an ACCEPTED one back while the booking is ASSIGNED or PARTNER_EN_ROUTE (the booking returns to CONFIRMED without a partner; an INSTANT booking also loses its allotted slot, its scheduled start and end cleared).",

      params: [["bookingId", "number", R, ""], ["eventType", "string", R, "BOOKING_TIMER_EVENT."], ["notes", "string", O, "At most 2000 characters."]],
      example: { bookingId: 12, eventType: "START" }, returns: { ...BOOKING_DETAIL, booking: { ...BOOKING_DETAIL.booking, bookingStatus: "IN_PROGRESS", actualStartAt: DATE } } },
    { id: "bookings-location", method: "POST", path: "/api/bookings/location", title: "Share location", success: 201, access: "owner",

    { id: "bookings-location-get", method: "GET", path: "/api/bookings/location/{bookingId}", title: "Latest location", success: 200, access: "owner or BOOKING_MANAGE READ",
      desc: "The partner's latest position for the booking, or an empty body; visible like the booking.",

  ]},
  { group: "Payments", items: [
    { id: "payments-order-create", method: "POST", path: "/api/payments/orders/create", title: "Create payment order", success: 201, access: "owner or PAYMENT_MANAGE WRITE",
      desc: "Module 7. An order for every unpaid ONLINE booking of the booking's checkout (not cancelled); the amount is their total. While an open (CREATED / PENDING) order has the same amount it is returned again; otherwise open ones are CANCELLED and a new one made (idempotency key = checkout id and a count; the MANUAL provider's order id is stable for the key). Cash bookings are 400.",
      params: [["bookingId", "number", R, "The customer's booking (or any, for staff)."]], example: { bookingId: 12 }, returns: ORDER_RESPONSE },
    { id: "payments-capture", method: "POST", path: "/api/payments/orders/capture", title: "Record payment", success: 200, access: "PAYMENT_MANAGE WRITE",
      desc: "The MANUAL provider's capture: staff record that the order was paid. One CAPTURED payment per booking (the reference gets _1, _2 for several), each booking PAID, a PENDING one CONFIRMED (history: Payment received), a payout for one already completed. Capturing a PAID order again returns its payments; one whose bookings changed is 400. Returns the first booking's payments.",
      params: [["paymentOrderId", "number", R, ""], ["providerPaymentId", "string", O, "The reference, e.g. a UPI transaction id (≤ 150)."]],
      example: { paymentOrderId: 3, providerPaymentId: "UPI1234567" }, returns: BOOKING_PAYMENTS },
    { id: "payments-webhook", method: "POST", path: "/api/payments/webhooks/{provider}", title: "Provider webhook", success: 200, access: "public",
      desc: "No token: the body is signed (header <code>X-NexHome-Signature</code>: hex HMAC-SHA256 of the raw body with <code>nexhome.payments.webhook-secret</code>, env <code>PAYMENT_WEBHOOK_SECRET</code>). Every event is stored once per (provider, id): a repeat is answered with the stored result. A bad signature is kept as IGNORED and answered 401. Handled: <code>payment.captured</code> (captures the order found by <code>data.orderId</code>) and <code>payment.failed</code> (order FAILED, the bookings' payment FAILED; <code>data.errorCode</code>, <code>errorMessage</code>); others IGNORED; an unknown order FAILED (200). Only MANUAL exists (404 otherwise).",
      params: [["provider", "string", P, "MANUAL."], ["id", "string", R, "The provider's event id."], ["type", "string", R, "payment.captured or payment.failed."], ["data", "object", R, "{orderId, paymentId, errorCode, errorMessage}"]],
      pathDefaults: { provider: "MANUAL" }, example: { id: "evt_123", type: "payment.captured", data: { orderId: "manual_order_5c1d0f3e9b2a4c7d8e6f", paymentId: "pay_123" } },
      returns: { webhookEventId: 9, provider: "MANUAL", providerEventId: "evt_123", eventType: "payment.captured", signatureVerified: true, processingStatus: "PROCESSED", receivedAt: DATE, processedAt: DATE, processingError: null } },
    { id: "payments-booking", method: "GET", path: "/api/payments/bookings/{bookingId}", title: "A booking's payments", success: 200, access: "owner or PAYMENT_MANAGE READ",
      desc: "The checkout's orders, the booking's payments (with what was refunded from each), refunds, cash collection and, for staff (PAYMENT_MANAGE or BOOKING_MANAGE read), the partner's payout (null for the customer).",
      params: [["bookingId", "number", P, ""]], pathDefaults: { bookingId: "" }, returns: BOOKING_PAYMENTS },
    { id: "payments-list", method: "GET", path: "/api/payments", title: "Payments", success: 200, access: "PAYMENT_MANAGE READ",
      desc: "Newest first; only the filters given. <code>search</code>: booking id, order id or payment reference.",
      params: [["page", "number", Q, ""], ["size", "number", Q, ""], ["status", "string", Q, "PAYMENT_STATUS."], ["customerProfileId", "number", Q, ""], ["search", "string", Q, ""]],
      returns: PAGE(PAYMENT_RESPONSE) },
    { id: "payments-orders", method: "GET", path: "/api/payments/orders", title: "Payment orders", success: 200, access: "PAYMENT_MANAGE READ",
      desc: "Newest first.", params: [["page", "number", Q, ""], ["size", "number", Q, ""]], returns: PAGE(ORDER_RESPONSE) },
    { id: "payments-stats", method: "GET", path: "/api/payments/stats", title: "Payment totals", success: 200, access: "PAYMENT_MANAGE READ",
      desc: "Captured (any payment captured, refunded or not), refunded (SUCCEEDED refunds), open orders, cash still due, and revenue: payments captured (by captured_at) plus cash COLLECTED (by confirmed_at) less SUCCEEDED refunds (by completed_at), in all, this month and for the last 10 months (IST, oldest first: the month's revenue and the running total at its end). The admin dashboard's Total Revenue card.",
      returns: { capturedAmount: 12500, capturedCount: 31, refundedAmount: 800, refundCount: 3, ordersAwaitingPayment: 2, cashDueAmount: 1200, cashDueCount: 3,
        revenueAmount: 14900, revenueThisMonth: 3200, revenueMonths: [{ month: "2026-09", added: 4100, total: 11700 }, { month: "2026-10", added: 3200, total: 14900 }] } },
    { id: "payments-refund", method: "POST", path: "/api/payments/refunds/create", title: "Refund", success: 201, access: "PAYMENT_MANAGE WRITE",
      desc: "From a CAPTURED or PARTIALLY_REFUNDED payment (locked while counted): never more than is left (400 with the amount), and not once the partner's payout for the booking is PROCESSING or PAID. The MANUAL gateway refunds at once (SUCCEEDED); the payment and booking become PARTIALLY_REFUNDED or REFUNDED and an open payout is worked out again for what is kept (CANCELLED at 0). Cancelling a paid booking refunds the rest automatically (reason \"Booking cancelled\").",
      params: [["paymentId", "number", R, ""], ["amount", "number", R, "> 0, 2 decimals."], ["reason", "string", R, "≤ 2000."]],
      example: { paymentId: 7, amount: 100, reason: "Goodwill" }, returns: REFUND_RESPONSE },
    { id: "payments-refunds", method: "GET", path: "/api/payments/refunds", title: "Refunds", success: 200, access: "PAYMENT_MANAGE READ",
      desc: "Newest first.", params: [["page", "number", Q, ""], ["size", "number", Q, ""], ["status", "string", Q, "REFUND_STATUS."]], returns: PAGE(REFUND_RESPONSE) },
    { id: "payments-cash", method: "GET", path: "/api/payments/cash-collections", title: "Cash collections", success: 200, access: "PAYMENT_MANAGE READ",
      desc: "Cash due from completed CASH bookings (one per booking, created DUE when the timer stops), newest first.",

      params: [["cashCollectionId", "number", R, ""], ["status", "string", R, "COLLECTED, DISPUTED or WAIVED."], ["notes", "string", O, "≤ 2000."]],
      example: { cashCollectionId: 4, status: "COLLECTED" }, returns: { ...CASH_RESPONSE, status: "COLLECTED", collectedBy: 22, confirmedAt: DATE } },
    { id: "payments-cash-ack", method: "PUT", path: "/api/payments/cash-collections/acknowledge", title: "Acknowledge cash", success: 200, access: "owner",
      desc: "The booking's customer confirms they paid the cash (not for WAIVED).", params: [["cashCollectionId", "number", R, ""]],

    { id: "payments-webhooks", method: "GET", path: "/api/payments/webhooks", title: "Webhook events", success: 200, access: "PAYMENT_MANAGE READ",
      desc: "Newest first, without the payloads.", params: [["page", "number", Q, ""], ["size", "number", Q, ""]],
      returns: PAGE({ webhookEventId: 9, provider: "MANUAL", providerEventId: "evt_123", eventType: "payment.captured", signatureVerified: true, processingStatus: "PROCESSED", receivedAt: DATE, processedAt: DATE, processingError: null }) }
  ]},
  { group: "Payouts", items: [

    { id: "payouts-earnings", method: "GET", path: "/api/payouts/earnings/{partnerProfileId}", title: "Partner earnings", success: 200, access: "owner or PAYOUT_MANAGE READ",

      example: { serviceVariantId: 12, priceOverride: 2099, durationMinutes: 240 }, returns: { ...VARIANT_RESPONSE, priceOverride: 2099.00 } },
    { id: "catalog-variants-delete", method: "DELETE", path: "/api/catalog/variants/delete/{serviceVariantId}", title: "Delete variant", success: 204, access: "CATALOG_MANAGE DELETE",
      desc: "Deletes the variant.", danger: "This permanently deletes the variant.",
      params: [["serviceVariantId", "number", P, "Must exist."]], pathDefaults: { serviceVariantId: "" }, returns: "No body (204)." },
    { id: "catalog-media-add", method: "POST", path: "/api/catalog/media/add", title: "Add media", success: 201, access: "CATALOG_MANAGE WRITE",
      desc: "An image or video of a service, by its storage or CDN key (there is no upload endpoint yet).",

      desc: "Send only what changes.",
      params: [["serviceMediaId", "number", R, "Must exist."], ["mediaType", "string", O, "IMAGE or VIDEO."], ["storageKey", "string", O, "Cannot be blanked."],
        ["displayOrder", "number", O, ""], ["isActive", "boolean", O, ""], ["serviceId", "number", N, "Never changes."]],
      example: { serviceMediaId: 4, displayOrder: 2 }, returns: { ...MEDIA_RESPONSE, displayOrder: 2 } },
    { id: "catalog-media-delete", method: "DELETE", path: "/api/catalog/media/delete/{serviceMediaId}", title: "Delete media", success: 204, access: "CATALOG_MANAGE DELETE",
      desc: "Deletes the media record (not the stored file).", danger: "This permanently deletes the media record.",
      params: [["serviceMediaId", "number", P, "Must exist."]], pathDefaults: { serviceMediaId: "" }, returns: "No body (204)." },
    { id: "catalog-requirements-add", method: "POST", path: "/api/catalog/requirements/add", title: "Add requirement", success: 201, access: "CATALOG_MANAGE WRITE",
      desc: "A free-text prerequisite or instruction for the customer or the partner, shown with the service. Requirements chosen from the CUSTOMER_REQUIREMENT / PARTNER_REQUIREMENT options are set through the service's create and update instead.",
      params: [["serviceId", "number", R, "Must exist."], ["requirementFor", "string", O, "CUSTOMER (default) or PARTNER; never changes."], ["requirementType", "string", R, "PREPARATION, ACCESS, MATERIALS, SAFETY or OTHER (REQUIREMENT_TYPE)."],
        ["description", "string", R, "At most 2000 characters."], ["isMandatory", "boolean", O, "Default true."], ["displayOrder", "number", O, "Default 0."]],
      example: { serviceId: 7, requirementType: "PREPARATION", description: "Keep water and electricity available.", displayOrder: 1 },
      returns: { ...REQUIREMENT_RESPONSE, requirementCode: null, description: "Keep water and electricity available.", displayOrder: 1 } },
    { id: "catalog-requirements-update", method: "PUT", path: "/api/catalog/requirements/update", title: "Update requirement", success: 200, access: "CATALOG_MANAGE WRITE",
      desc: "Send only what changes.",
      params: [["serviceRequirementId", "number", R, "Must exist."], ["requirementType", "string", O, ""], ["description", "string", O, "Cannot be blanked."],
        ["isMandatory", "boolean", O, ""], ["displayOrder", "number", O, ""], ["serviceId", "number", N, "Never changes."]],
      example: { serviceRequirementId: 5, isMandatory: false }, returns: { ...REQUIREMENT_RESPONSE, isMandatory: false } },
    { id: "catalog-requirements-delete", method: "DELETE", path: "/api/catalog/requirements/delete/{serviceRequirementId}", title: "Delete requirement", success: 204, access: "CATALOG_MANAGE DELETE",
      desc: "Deletes the requirement.", danger: "This permanently deletes the requirement.",
      params: [["serviceRequirementId", "number", P, "Must exist."]], pathDefaults: { serviceRequirementId: "" }, returns: "No body (204)." }
  ]},
  { group: "FAQs", items: [
    { id: "faqs-public", method: "GET", path: "/api/faqs", title: "Published FAQs", success: 200, access: "public",
      desc: "Published FAQs in display order, except those of an inactive category or service. <code>audience=CUSTOMER</code> (or PARTNER) also returns BOTH.",
      params: [["audience", "string", Q, "CUSTOMER, PARTNER or BOTH."], ["categoryId", "number", Q, "Only FAQs of this category."],
        ["serviceId", "number", Q, "Only FAQs of this service."]], queryDefaults: { audience: "CUSTOMER" }, returns: [FAQ_RESPONSE] },
    { id: "faqs-all", method: "GET", path: "/api/faqs/all", title: "All FAQs", success: 200, access: "FAQ_MANAGE READ",
      desc: "Every FAQ, published or not, newest first. The audience filter is exact here.",
      params: [["page", "number", Q, "Zero-based; default 0."], ["size", "number", Q, "1 to 100; default 10."],
        ["audience", "string", Q, "Exact audience."], ["categoryId", "number", Q, ""], ["serviceId", "number", Q, ""],
        ["isPublished", "boolean", Q, ""], ["search", "string", Q, "Part of the question."]],
      returns: { content: [FAQ_RESPONSE], page: 0, size: 10, totalElements: 1, totalPages: 1 } },
    { id: "faqs-create", method: "POST", path: "/api/faqs/create", title: "Create FAQ", success: 201, access: "FAQ_MANAGE WRITE",
      desc: "General, or for one category or one service (not both). Unpublished unless <code>isPublished: true</code>.",
      params: [["question", "string", R, "At most 500 characters."], ["answer", "string", R, "At most 10000 characters."],
        ["categoryId", "number", O, "Must exist; never changes."], ["serviceId", "number", O, "Must exist; never changes."],
        ["audience", "string", R, "CUSTOMER, PARTNER or BOTH."], ["displayOrder", "number", O, "Default 0."], ["isPublished", "boolean", O, "Default false."]],
      example: { question: "How long does deep cleaning take?", answer: "Usually 3 to 4 hours for a 2 BHK.", serviceId: 7,
        audience: "CUSTOMER", displayOrder: 1, isPublished: true }, returns: FAQ_RESPONSE },
    { id: "faqs-update", method: "PUT", path: "/api/faqs/update", title: "Update FAQ", success: 200, access: "FAQ_MANAGE WRITE",
      desc: "Send only what changes; <code>isPublished</code> publishes or hides it.",
      params: [["faqId", "number", R, "Must exist."], ["question", "string", O, "Cannot be blanked."], ["answer", "string", O, "Cannot be blanked."],
        ["audience", "string", O, ""], ["displayOrder", "number", O, ""], ["isPublished", "boolean", O, ""],
        ["categoryId", "number", N, "Never changes."], ["serviceId", "number", N, "Never changes."]],
      example: { faqId: 3, isPublished: false }, returns: { ...FAQ_RESPONSE, isPublished: false } },
    { id: "faqs-delete", method: "DELETE", path: "/api/faqs/delete/{faqId}", title: "Delete FAQ", success: 204, access: "FAQ_MANAGE DELETE",
      desc: "Deletes the FAQ.", danger: "This permanently deletes the FAQ.",
      params: [["faqId", "number", P, "Must exist."]], pathDefaults: { faqId: "" }, returns: "No body (204)." }
  ]},
  { group: "Policies", items: [
    { id: "policies-current", method: "GET", path: "/api/policies/current", title: "Current policies", success: 200, access: "public",
      desc: "The current version of every policy: per key, the published version with the latest <code>effectiveFrom</code> that has started. <code>audience=CUSTOMER</code> (or PARTNER) also returns BOTH.",
      params: [["audience", "string", Q, "CUSTOMER, PARTNER or BOTH."]], returns: [POLICY_PUBLISHED] },
    { id: "policies-current-key", method: "GET", path: "/api/policies/current/{policyKey}", title: "Current version of a policy", success: 200, access: "public",
      desc: "The current version of one policy, e.g. TERMS_OF_SERVICE.", params: [["policyKey", "string", P, "e.g. TERMS_OF_SERVICE."]],
      pathDefaults: { policyKey: "TERMS_OF_SERVICE" }, returns: POLICY_PUBLISHED },
    { id: "policies-pending", method: "GET", path: "/api/policies/pending", title: "Policies to accept", success: 200, access: "token",
      desc: "Current policies for the caller's roles (CUSTOMER and/or PARTNER, plus BOTH) that they have not accepted yet; show these before letting them book or work. Staff-only accounts get an empty list.",
      params: [], returns: [POLICY_PUBLISHED] },
    { id: "policies-accept", method: "POST", path: "/api/policies/accept", title: "Accept policy", success: 201, access: "token",
      desc: "Records that the caller accepts a policy version, which must be the current one; once per user and version. The server records the client address it sees.",
      params: [["policyDocumentId", "number", R, "The current version (from Policies to accept)."],
        ["acceptanceMethod", "string", R, "APP_CHECKBOX, WEB_CHECKBOX or SIGNED_DOCUMENT."]],
      example: { policyDocumentId: 6, acceptanceMethod: "APP_CHECKBOX" }, returns: ACCEPTANCE_RESPONSE },
    { id: "policies-acceptances-me", method: "GET", path: "/api/policies/acceptances/me", title: "My acceptances", success: 200, access: "token",
      desc: "The caller's acceptances, newest first.", params: [], returns: [ACCEPTANCE_RESPONSE] },
    { id: "policies-acceptances-user", method: "GET", path: "/api/policies/acceptances/users/{userId}", title: "Acceptances of a user", success: 200, access: "self or POLICY_MANAGE READ",
      desc: "A user's acceptances, newest first.", params: [["userId", "number", P, "Must exist."]], pathDefaults: { userId: "21" },
      returns: [ACCEPTANCE_RESPONSE] },
    { id: "policies-all", method: "GET", path: "/api/policies/all", title: "All policy versions", success: 200, access: "POLICY_MANAGE READ",
      desc: "Every version, drafts included, newest first.",
      params: [["page", "number", Q, "Zero-based; default 0."], ["size", "number", Q, "1 to 100; default 10."],
        ["policyKey", "string", Q, "Exact key."], ["audience", "string", Q, "Exact audience."], ["isPublished", "boolean", Q, ""]],
      returns: { content: [POLICY_RESPONSE], page: 0, size: 10, totalElements: 1, totalPages: 1 } },
    { id: "policies-get", method: "GET", path: "/api/policies/{policyDocumentId}", title: "Get policy version", success: 200, access: "POLICY_MANAGE READ",
      desc: "One version, draft or published.", params: [["policyDocumentId", "number", P, "Must exist."]], pathDefaults: { policyDocumentId: "6" },
      returns: POLICY_RESPONSE },
    { id: "policies-create", method: "POST", path: "/api/policies/create", title: "Create policy version", success: 201, access: "POLICY_MANAGE WRITE",
      desc: "An unpublished version. A new version of an existing policy is a new document with the same key and another version.",
      params: [["policyKey", "string", R, "Capital letters, digits, _; at most 80. Never changes."],
        ["title", "string", R, "At most 200 characters."], ["audience", "string", R, "CUSTOMER, PARTNER or BOTH."],
        ["version", "string", R, "Letters, digits, . - _; at most 30; unique per key (409). Never changes."],
        ["content", "string", R, "The full text."],
        ["effectiveFrom", "string", R, "ISO-8601 instant, e.g. 2026-11-01T00:00:00+05:30. Becomes current then (once published)."]],
      example: { policyKey: "TERMS_OF_SERVICE", title: "Terms of Service", audience: "BOTH", version: "1.0",
        content: "These terms govern your use of NexHome ...", effectiveFrom: "2026-11-01T00:00:00+05:30" }, returns: POLICY_RESPONSE },
    { id: "policies-update", method: "PUT", path: "/api/policies/update", title: "Update policy version", success: 200, access: "POLICY_MANAGE WRITE",
      desc: "Changes an <b>unpublished</b> version; send only what changes. A published version never changes: create a new version.",
      params: [["policyDocumentId", "number", R, "An unpublished version."], ["title", "string", O, "Cannot be blanked."],
        ["audience", "string", O, ""], ["content", "string", O, "Cannot be blanked."], ["effectiveFrom", "string", O, "ISO-8601 instant."],
        ["policyKey", "string", N, "Never changes."], ["version", "string", N, "Never changes."], ["isPublished", "boolean", N, "Use Publish."]],
      example: { policyDocumentId: 6, content: "These terms govern your use of NexHome (updated) ..." },
      returns: { ...POLICY_RESPONSE, content: "These terms govern your use of NexHome (updated) ..." } },
    { id: "policies-publish", method: "PUT", path: "/api/policies/publish", title: "Publish policy version", success: 200, access: "POLICY_MANAGE WRITE",
      desc: "Publishes a version. It can no longer change or be deleted, and it becomes current once its <code>effectiveFrom</code> has passed.",
      danger: "Publishing cannot be undone.", params: [["policyDocumentId", "number", R, "An unpublished version."]],
      example: { policyDocumentId: 6 }, returns: POLICY_PUBLISHED },
    { id: "policies-delete", method: "DELETE", path: "/api/policies/delete/{policyDocumentId}", title: "Delete policy version", success: 204, access: "POLICY_MANAGE DELETE",
      desc: "Deletes an unpublished version.", danger: "This permanently deletes the draft.",
      params: [["policyDocumentId", "number", P, "An unpublished version."]], pathDefaults: { policyDocumentId: "" }, returns: "No body (204)." }
  ]},
  { group: "Lookups", items: [
    { id: "lookup-values-dropdown", method: "GET", path: "/api/lookups/values/{typeCode}", title: "Dropdown values", success: 200, access: "public",
      desc: "The active values of an active lookup type, in display order: the options of a UI dropdown. Business fields store the <code>valueCode</code>.",
      params: [["typeCode", "string", P, "e.g. ACCOUNT_STATUS, ADDRESS_TYPE, PREFERRED_CONTACT_LANGUAGE, AVAILABILITY_SLOT."]], pathDefaults: { typeCode: "ACCOUNT_STATUS" },
      returns: ACCOUNT_STATUS_VALUES },
    { id: "lookup-types-list", method: "GET", path: "/api/lookups/types", title: "List lookup types", success: 200, access: "LOOKUP_MANAGE READ",
      desc: "Every lookup type, active or not, ordered by code.", params: [],
      returns: [{ lookupTypeId: 1, typeCode: "ACCOUNT_STATUS", typeName: "Account Status", description: null, activeFlag: true,
        isSystemManaged: true, creationDate: DATE }, LOOKUP_TYPE_RESPONSE] },
    { id: "lookup-types-create", method: "POST", path: "/api/lookups/types/create", title: "Create lookup type", success: 201, access: "LOOKUP_MANAGE WRITE",
      desc: "A new dropdown group. Types created here are admin-managed (<code>isSystemManaged: false</code>) unless told otherwise.",
      params: [
        ["typeCode", "string", R, "Capital letters, digits and underscores, starting with a letter; at most 80; unique (409). Never changes."],
        ["typeName", "string", R, "At most 120 characters."],
        ["description", "string", O, "Free text."],
        ["activeFlag", "boolean", O, "Defaults to true."],
        ["isSystemManaged", "boolean", O, "Defaults to false. True means application logic depends on it: it and its values can never be deactivated."]],
      example: { typeCode: "SERVICE_AREA", typeName: "Service Area", description: "Areas partners can serve" },
      returns: LOOKUP_TYPE_RESPONSE },
    { id: "lookup-types-update", method: "PUT", path: "/api/lookups/types/update", title: "Update lookup type", success: 200, access: "LOOKUP_MANAGE WRITE",
      desc: "Renames or (de)activates a type. <code>description</code> is always replaced (leaving it out clears it).",
      params: [
        ["lookupTypeId", "number", R, "Must exist."],
        ["typeName", "string", O, "Cannot be blanked."],
        ["description", "string", O, "Always replaced."],
        ["activeFlag", "boolean", O, "System-managed types cannot be deactivated."],
        ["typeCode", "string", N, "Never changes."],
        ["isSystemManaged", "boolean", N, "Never changes."]],
      example: { lookupTypeId: 51, typeName: "Service Area", description: "Areas partners and customers can choose" },
      returns: { ...LOOKUP_TYPE_RESPONSE, description: "Areas partners and customers can choose" } },
    { id: "lookup-type-values", method: "GET", path: "/api/lookups/types/values/{lookupTypeId}", title: "All values of a type", success: 200, access: "LOOKUP_MANAGE READ",
      desc: "Every value of the type, including inactive ones, for maintenance screens.",
      params: [["lookupTypeId", "number", P, "Must exist."]], pathDefaults: { lookupTypeId: "1" }, returns: ACCOUNT_STATUS_VALUES },
    { id: "lookup-values-add", method: "POST", path: "/api/lookups/values/add", title: "Add lookup value", success: 201, access: "LOOKUP_MANAGE WRITE",
      desc: "Adds an option to a type. <code>isDefault: true</code> makes it the type's only default (the previous default is cleared).",
      params: [
        ["lookupTypeId", "number", R, "Must exist; use the id from Create lookup type."],
        ["valueCode", "string", R, "Letters, digits, _ . -; at most 80; unique within the type (409). Never changes."],
        ["displayName", "string", R, "At most 150 characters."],
        ["description", "string", O, "Free text."],
        ["displayOrder", "number", O, "Defaults to 0; dropdowns sort by it."],
        ["activeFlag", "boolean", O, "Defaults to true."],
        ["isDefault", "boolean", O, "Defaults to false; an inactive value cannot be the default."],
        ["metadata", "object", O, "Any JSON object, e.g. an icon or colour; defaults to {}."]],
      example: { lookupTypeId: 51, valueCode: "MADHAPUR", displayName: "Madhapur", displayOrder: 1, isDefault: true,
        metadata: { city: "Hyderabad" } }, returns: LOOKUP_VALUE_RESPONSE },
    { id: "lookup-values-update", method: "PUT", path: "/api/lookups/values/update", title: "Update lookup value", success: 200, access: "LOOKUP_MANAGE WRITE",
      desc: "Send only what changes, except <code>description</code>, which is always replaced. Values of system-managed types cannot be deactivated.",
      params: [
        ["lookupValueId", "number", R, "Must exist."],
        ["displayName", "string", O, "Cannot be blanked."],
        ["description", "string", O, "Always replaced."],
        ["displayOrder", "number", O, "Missing keeps it."],
        ["activeFlag", "boolean", O, "Missing keeps it."],
        ["isDefault", "boolean", O, "true makes it the default; false removes it."],
        ["metadata", "object", O, "Replaces the whole object; missing keeps it."],
        ["lookupTypeId", "number", N, "Never changes."],
        ["valueCode", "string", N, "Never changes."]],
      example: { lookupValueId: 300, displayName: "Madhapur (Hyderabad)", displayOrder: 2 },
      returns: { ...LOOKUP_VALUE_RESPONSE, displayName: "Madhapur (Hyderabad)", displayOrder: 2 } }
  ]},
  { group: "Roles", items: [
    { id: "roles-list", method: "GET", path: "/api/roles", title: "List roles", success: 200, access: "ROLE_MANAGE READ",
      desc: "Every role, active or not, in id order (the seeded roles first). Used by System Configuration > Roles.", params: [],
      returns: [{ roleId: 1, code: "SUPER_USER", name: "Super User", description: null, activeFlag: true, creationDate: DATE }] },
    { id: "roles-get", method: "GET", path: "/api/roles/{roleId}", title: "Get role", success: 200, access: "ROLE_MANAGE READ",
      desc: "One role, active or not.", params: [["roleId", "number", P, "Must exist."]], pathDefaults: { roleId: "2" },
      returns: { roleId: 2, code: "ADMIN", name: "Admin", description: null, activeFlag: true, creationDate: DATE } },
    { id: "role-functions-list", method: "GET", path: "/api/roles/functions/{roleId}", title: "A role's permissions", success: 200, access: "ROLE_MANAGE READ",
      desc: "The functions granted to the role (active or not), by function module and code. Used by System Configuration > Roles > a role.",
      params: [["roleId", "number", P, "Must exist."]], pathDefaults: { roleId: "2" },
      returns: [{ roleFunctionId: 1, roleId: 2, roleCode: "ADMIN", functionId: 1, functionCode: "LOOKUP_MANAGE", functionName: "Manage Lookups",
        canRead: true, canWrite: false, canDelete: false, activeFlag: true, creationDate: DATE }] },
    { id: "roles-create", method: "POST", path: "/api/roles/create", title: "Create role", success: 201, access: "ROLE_MANAGE WRITE",
      desc: "A new role. Give it permissions with <a href=\"#role-functions-add\">Add role function</a>.",
      params: [
        ["code", "string", R, "Capital letters, digits and underscores; at most 30; unique (409). Never changes."],
        ["name", "string", R, "At most 80 characters."],
        ["description", "string", O, "Free text."],
        ["activeFlag", "boolean", O, "Defaults to true."]],
      example: { code: "SUPPORT_AGENT", name: "Support Agent", description: "Handles customer support tickets" }, returns: ROLE_RESPONSE },
    { id: "roles-update", method: "PUT", path: "/api/roles/update", title: "Update role", success: 200, access: "ROLE_MANAGE WRITE",
      desc: "Renames or (de)activates a role. <code>description</code> is always replaced. Deactivating a role removes its permissions from every user at once.",
      params: [
        ["roleId", "number", R, "Must exist."],
        ["name", "string", O, "Cannot be blanked."],
        ["description", "string", O, "Always replaced: leaving it out clears it."],
        ["activeFlag", "boolean", O, "Missing keeps it."],
        ["code", "string", N, "Never changes."]],
      example: { roleId: 6, name: "Support Agent", description: "Handles customer and partner support tickets", activeFlag: true },
      returns: { ...ROLE_RESPONSE, description: "Handles customer and partner support tickets" } },
    { id: "roles-delete", method: "DELETE", path: "/api/roles/delete/{roleId}", title: "Delete role", success: 204, access: "ROLE_MANAGE DELETE",
      desc: "Deletes a role that no user has and that has no role functions; otherwise 409. Deactivate roles that are in use.",
      danger: "This permanently deletes the role.",
      params: [["roleId", "number", P, "Must exist and be unused."]], pathDefaults: { roleId: "" }, returns: "No body (204)." }
  ]},
  { group: "Role functions", items: [
    { id: "role-functions-add", method: "POST", path: "/api/roles/functions/add", title: "Add role function", success: 201, access: "ROLE_MANAGE WRITE",
      desc: "Grants a role access to a function. <code>canWrite</code> or <code>canDelete</code> also turns on <code>canRead</code>. Look up function ids with <code>GET /api/functions</code>.",
      params: [
        ["roleId", "number", R, "Role must exist (404)."],
        ["functionId", "number", R, "Function must exist (404); the same pair twice gives 409."],
        ["canRead", "boolean", O, "Defaults to false."],
        ["canWrite", "boolean", O, "Defaults to false; true also sets canRead."],
        ["canDelete", "boolean", O, "Defaults to false; true also sets canRead."],
        ["activeFlag", "boolean", O, "Defaults to true."]],
      example: { roleId: 6, functionId: 6, canRead: true, canWrite: true, canDelete: false }, returns: ROLE_FUNCTION_RESPONSE },
    { id: "role-functions-update", method: "PUT", path: "/api/roles/functions/update", title: "Update role function", success: 200, access: "ROLE_MANAGE WRITE",
      desc: "Changes the access flags. A missing flag keeps its value. Takes effect on the users' next request.",
      params: [
        ["roleFunctionId", "number", R, "Must exist."],
        ["canRead", "boolean", O, "Cannot be turned off while canWrite or canDelete is on."],
        ["canWrite", "boolean", O, "Missing keeps it."],
        ["canDelete", "boolean", O, "Missing keeps it."],
        ["activeFlag", "boolean", O, "Missing keeps it."],
        ["roleId", "number", N, "Never changes."],
        ["functionId", "number", N, "Never changes."]],
      example: { roleFunctionId: 7, canDelete: true }, returns: { ...ROLE_FUNCTION_RESPONSE, canDelete: true } },
    { id: "role-functions-delete", method: "DELETE", path: "/api/roles/functions/delete/{roleFunctionId}", title: "Delete role function", success: 204, access: "ROLE_MANAGE DELETE",
      desc: "Removes the grant; the role and function stay.",
      params: [["roleFunctionId", "number", P, "Must exist."]], pathDefaults: { roleFunctionId: "" }, returns: "No body (204)." }
  ]},
  { group: "Functions", items: [
    { id: "functions-list", method: "GET", path: "/api/functions", title: "List functions", success: 200, access: "FUNCTION_MANAGE READ",
      desc: "Every function, active or not, ordered by module and code. Used by System Configuration > Functions.", params: [],
      returns: [{ functionId: 1, functionModule: "IDENTITY", functionCode: "FUNCTION_MANAGE", functionName: "Manage Functions",
        functionType: "FEATURE", description: null, activeFlag: true, creationDate: DATE }] },
    { id: "functions-create", method: "POST", path: "/api/functions/create", title: "Create function", success: 201, access: "FUNCTION_MANAGE WRITE",
      desc: "A module, screen, feature, API or action that roles can be granted. Module and code never change. A new admin endpoint is protected by its function code.",
      params: [
        ["functionModule", "string", R, "Capital letters, digits and underscores, e.g. SUPPORT; at most 50."],
        ["functionCode", "string", R, "Capital letters, digits and underscores; at most 100; unique (409)."],

/** The roles that may call an endpoint, from its access, as HTML list items. */
function whoCanAccess(e) {
  if (isPublic(e)) return ["Anyone, without signing in."];
  if (e.access === "token") return ["Any signed-in user with an ACTIVE account: " + ALL_ROLES.join(", ") + "."];
  if (e.access === "SUPER_USER only") return ["SUPER_USER only. This cannot be granted to other roles."];
  const accountRule = /^(?:(self|owner) or )?(role's|account's) function (READ|WRITE|DELETE)$/.exec(e.access);
  if (accountRule) {
    const [, who, kind, level] = accountRule;
    const lines = who ? [(OWNERS.find(([prefix]) => e.path.startsWith(prefix))?.[1] ?? "The owner of the record") + "."] : [];
    lines.push((who ? "Anyone else: " : "") + `${level} on the function of the ${kind === "role's" ? "role given" : "account's role"}: `
      + Object.entries(ACCOUNT_FUNCTIONS).map(([role, fn]) => `${role} through ${fn} (${["SUPER_USER", ...((GRANTS[fn] || {})[level] || [])].join(", ")})`).join("; ")
      + ". SUPER_USER accounts and roles without a function: super users only." + (kind === "account's" ? " A staff account goes by its highest staff role." : ""));
    return lines;
  }
  const anyOf = /^(\w+) (or|and) (\w+) (READ|WRITE|DELETE)$/.exec(e.access);
  if (anyOf) {
    const [, a, joiner, b, level] = anyOf;
    const of = (fn) => ["SUPER_USER", ...((GRANTS[fn] || {})[level] || [])];
    const roles = joiner === "or" ? [...new Set([...of(a), ...of(b)])] : of(a).filter((role) => of(b).includes(role));
    return [roles.join(", ") + ` (${level} on ${a} ${joiner} ${b}).`];
  }
  const owner = /^(self|owner) or /.test(e.access);
  const [functionCode, level] = e.access.replace(/^(self|owner) or /, "").split(" ");
  const roles = ["SUPER_USER", ...((GRANTS[functionCode] || {})[level] || [])];
  const lines = [];
  if (owner) {
    const match = OWNERS.find(([prefix]) => e.path.startsWith(prefix));
    lines.push((match ? match[1] : "The owner of the record") + ".");
  }
  lines.push((owner ? "Anyone else: " : "") + roles.join(", ") + ` (through ${functionCode} ${level}).`);
  return lines;
}

function saveTokens(access, refresh) {
  $("#accessToken").value = access || "";
  store.set("nexhome.accessToken", access || "");
  store.set("nexhome.refreshToken", refresh || "");
  showTokenState();
}
function showTokenState() {
  const state = $("#tokenState");
  const refresh = store.get("nexhome.refreshToken");
  if (!accessToken()) { state.className = "token-state"; state.textContent = "Not signed in: log in with Request OTP + Verify OTP."; return; }
  let who = "";
  try { who = " as user " + JSON.parse(atob(accessToken().split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).sub; } catch { /* not a JWT */ }
  state.className = "token-state set";
  state.textContent = `Signed in${who}.` + (refresh ? " Refresh token saved." : "");
}
// Request examples use the saved refresh token instead of the placeholder
function exampleFor(e) {
  if (!e.example) return undefined;
  const refresh = store.get("nexhome.refreshToken");
  return e.example.refreshToken === REFRESH_PLACEHOLDER && refresh ? { ...e.example, refreshToken: refresh } : e.example;
}

// ------------------------------------------------- navigation
function renderNav(filter = "") {
  const f = filter.trim().toLowerCase();
  const current = location.hash.slice(1);
  let html = `<a class="nav-item ${current === "" || current === "overview" ? "active" : ""}" href="#overview"><span class="label">Overview &amp; quick start</span></a>`
    + `<a class="nav-item ${current === "errors" ? "active" : ""}" href="#errors"><span class="label">Error responses</span></a>`;
  for (const g of API) {
    const items = g.items.filter(e => !f || (e.title + " " + e.path + " " + e.method).toLowerCase().includes(f));
    if (!items.length) continue;
    // A service is open when the user opened it, while filtering, or when it holds the endpoint being viewed
    const open = f !== "" || g.group === openGroup;
    html += `<button type="button" class="group-toggle ${open ? "open" : ""}" data-group="${esc(g.group)}" aria-expanded="${open}">`
      + `<span>${esc(g.group)}</span><span class="count">${items.length}</span><span class="chevron" aria-hidden="true"></span></button>`
      + `<div class="group-items ${open ? "" : "collapsed"}">`;
    for (const e of items) {
      html += `<a class="nav-item ${current === e.id ? "active" : ""}" href="#${e.id}" title="${esc(e.method + " " + e.path)}">`
        + `<span class="m ${e.method}">${e.method}</span><span class="label">${esc(e.title)}</span></a>`;
    }
    html += `</div>`;
  }
  $("#nav").innerHTML = html;
}

// The one service open in the sidebar (accordion), remembered between visits
let openGroup = store.get("nexhome.openGroup") || null;
function setOpenGroup(group) {
  openGroup = group;
  store.set("nexhome.openGroup", group || "");
}
$("#nav").addEventListener("click", (event) => {
  const toggle = event.target.closest(".group-toggle");
  if (!toggle) return;
  const group = toggle.dataset.group;
  const willOpen = toggle.getAttribute("aria-expanded") !== "true";
  setOpenGroup(willOpen ? group : null);
  // Opening one service closes every other
  for (const other of document.querySelectorAll(".group-toggle")) {
    const open = willOpen && other === toggle;
    other.classList.toggle("open", open);
    other.setAttribute("aria-expanded", String(open));
    other.nextElementSibling.classList.toggle("collapsed", !open);
  }
});

function responsesTable(e) {
  const code = (status) => `<span class="code ${status < 300 ? "ok" : "err"}">${status}</span>`;
  const success = typeof e.returns === "string"
    ? `<p class="muted">${esc(e.returns)}</p>`
    : `<pre>${esc(JSON.stringify(e.returns, null, 2))}</pre>`;
  const errors = [...(ERRORS[e.id] || [])];
  if (!isPublic(e)) errors.push([401, "Authentication is required."], [401, "The session has ended. Log in again."]);
  if (!isPublic(e) && e.access !== "token") errors.push([403, "You do not have permission to perform this action."]);
  errors.sort((a, b) => a[0] - b[0]);
  const rows = errors.map(([status, message]) => {
    const example = { path: e.path.replace(/\{(\w+)\}/, (_, name) => (e.pathDefaults && e.pathDefaults[name]) || "1"), method: e.method,

    return `<tr><td>${code(status)}</td><td>${esc(STATUS_TEXT[status])}</td><td>
      <details><summary>${esc(message)}</summary><pre>${esc(JSON.stringify(example, null, 2))}</pre></details></td></tr>`;
  }).join("");
  return `<table class="responses"><tr><th>Code</th><th>Status</th><th>Body</th></tr>
    <tr><td>${code(e.success)}</td><td>${esc(STATUS_TEXT[e.success])}</td><td>${success}</td></tr>${rows}</table>

  const paramsSection = e.params.length
    ? `<h3>${pathParams.length || queryParams.length ? "Parameters" : "Request body"}</h3>
       <table><tr><th>Field</th><th>Type</th><th>Required?</th><th>Rules</th></tr>${rows}</table>`
    : `<h3>Request</h3><p class="muted">No parameters or body.</p>`;
  return `<div class="card">
    <div class="endpoint-head"><span class="m ${e.method}">${e.method}</span><span class="path">${esc(e.path)}</span>${accessBadge(e)}</div>
    <h2 style="margin-top:12px">${esc(e.title)}</h2>
    <p>${e.desc}</p>
    <h3>Who can access</h3>
    <ul class="who">${whoCanAccess(e).map(line => `<li>${esc(line)}</li>`).join("")}${WHO_NOTES[e.id] ? `<li>${esc(WHO_NOTES[e.id])}</li>` : ""}</ul>
    ${!isPublic(e) ? `<p class="muted">Accounts that are not ACTIVE get 403 everywhere. Roles listed are the seeded grants; a super user can grant more through Role functions.</p>` : ""}
    ${e.danger ? `<div class="note">${esc(e.danger)}</div>` : ""}
    ${paramsSection}
    <h3>Responses</h3>
    ${responsesTable(e)}
  </div>
  <div class="card">
    <h3 style="margin-top:0">Try it out</h3>
    <div class="try">
      ${!isPublic(e) && !accessToken() ? `<div class="note">Not signed in: this call will get 401. Log in first with <a href="#auth-otp-request">Request OTP</a> and <a href="#auth-otp-verify">Verify OTP</a>.</div>` : ""}
      ${pathParams.map(([name]) => `<div><label class="param-label" for="pp-${name}"><span>${esc(name)}</span><span class="tag path">Path</span></label><br>
        <input class="mono" id="pp-${name}" data-path-param="${name}" placeholder="e.g. 1" value="${esc((e.pathDefaults && e.pathDefaults[name]) || "")}"></div>`).join("")}
      ${queryParams.map(([name, , , rule]) => `<div><label class="param-label" for="qp-${name}"><span>${esc(name)}</span><span class="tag query">Query</span></label><br>
        <input class="mono" id="qp-${name}" data-query-param="${name}" placeholder="optional" title="${esc(rule)}" value="${esc((e.queryDefaults && e.queryDefaults[name]) || "")}"></div>`).join("")}
      ${example ? `<div class="copy-row"><label for="body">Request body</label>
        <button class="btn small" type="button" id="resetBody">Reset example</button></div>
        <textarea id="body" spellcheck="false" rows="${body.split("\n").length + 1}">${esc(body)}</textarea>` : ""}
      <div class="actions">
        <button class="btn primary" type="button" id="execute">Execute</button>
        <button class="btn" type="button" id="showCurl">Copy as curl</button>
        ${!isPublic(e) && accessToken() ? `<span class="muted">Sends the access token from the sidebar.</span>` : ""}
      </div>
      <div id="curlBox" class="hidden"><pre id="curl"></pre></div>
      <div class="response" id="response"></div>
    </div>
  </div>`;
}

function render() {
  const id = location.hash.slice(1) || "overview";
  const e = ALL.find(x => x.id === id);
  if (e) setOpenGroup(e.group);
  $("#content").innerHTML = id === "errors" ? errorsPage() : e ? endpointPage(e) : overviewPage();
  renderNav($("#search").value);
  $("#main").scrollTop = 0;
  if (e) wireEndpoint(e);
}

// ------------------------------------------------- try it out
function buildUrl(e) {
  let path = e.path;
  for (const input of document.querySelectorAll("[data-path-param]")) {
    const value = input.value.trim();
    if (!value) throw new Error(`Enter ${input.dataset.pathParam}.`);
    path = path.replace(`{${input.dataset.pathParam}}`, encodeURIComponent(value));
  }
  // Empty query inputs are left out
  const query = [...document.querySelectorAll("[data-query-param]")]
    .filter(input => input.value.trim() !== "")
    .map(input => `${encodeURIComponent(input.dataset.queryParam)}=${encodeURIComponent(input.value.trim())}`)
    .join("&");
  return baseUrl() + path + (query ? "?" + query : "");
}

function readBody() {
  const area = $("#body");
  if (!area) return undefined;
  const text = area.value.trim();
  if (!text) return undefined;
  try { JSON.parse(text); } catch (err) { throw new Error("Request body is not valid JSON: " + err.message); }
  if (text.includes(REFRESH_PLACEHOLDER)) throw new Error("Paste a refresh token first (or log in with Verify OTP, which saves it).");
  return text;
}

// Public endpoints get no Authorization header: a stale token would be rejected even there
function headersFor(e, body) {
  const headers = { Accept: "application/json" };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (!isPublic(e) && accessToken()) headers.Authorization = "Bearer " + accessToken();
  return headers;
}

function curlFor(e, url, body) {
  let cmd = `curl -X ${e.method} "${url}"`;
  if (!isPublic(e)) cmd += ` \\\n  -H "Authorization: Bearer ${accessToken() || "<access token>"}"`;
  if (body !== undefined) cmd += ` \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(JSON.parse(body))}'`;
  return cmd;
}

function wireEndpoint(e) {
  const reset = $("#resetBody");
  if (reset) reset.onclick = () => { $("#body").value = JSON.stringify(exampleFor(e), null, 2); };

  $("#showCurl").onclick = async () => {
    try {
      const cmd = curlFor(e, buildUrl(e), readBody());
      $("#curl").textContent = cmd;
      $("#curlBox").classList.remove("hidden");
      try { await navigator.clipboard.writeText(cmd); $("#showCurl").textContent = "Copied"; setTimeout(() => $("#showCurl").textContent = "Copy as curl", 1500); }
      catch { /* clipboard unavailable: the command is shown instead */ }
    } catch (err) { showResponse({ error: err.message }); }
  };

  $("#execute").onclick = async () => {
    let url, body;
    try { url = buildUrl(e); body = readBody(); } catch (err) { return showResponse({ error: err.message }); }
    if (e.danger && !confirm(e.danger + "\n\nContinue?")) return;
    const button = $("#execute");
    button.disabled = true; button.textContent = "Running...";
    const started = performance.now();
    try {
      const res = await fetch(url, { method: e.method, headers: headersFor(e, body), body });
      const ms = Math.round(performance.now() - started);
      const text = await res.text();
      let pretty = text, json = null;
      try { json = text ? JSON.parse(text) : null; pretty = json ? JSON.stringify(json, null, 2) : ""; } catch { /* not JSON */ }
      let saved = "";
      if (res.ok && e.savesTokens && json) {
        const tokens = e.savesTokens === "root" ? json : json.tokens;
        if (tokens && tokens.accessToken) { saveTokens(tokens.accessToken, tokens.refreshToken); saved = "Tokens saved: protected endpoints will use them."; }
      }
      if (res.ok && e.clearsTokens) { saveTokens("", ""); saved = "Signed out: saved tokens cleared."; }
      // Every NexHome response is JSON; anything else came from another server
      if (!res.ok && !(json && "statusCode" in json)) {
        saved = `This response did not come from the NexHome backend. Check the Server field in the sidebar (usually http://localhost:8080).`;
      }
      showResponse({ status: res.status, statusText: res.statusText, ok: res.ok, ms, url, body: pretty, saved });
    } catch (err) {
      showResponse({ error: location.protocol === "file:"
        ? "This page was opened as a file, which browsers do not let call the API. Open it through IntelliJ instead (right-click api-docs.html > Open In > Browser), or use Copy as curl."
        : `Could not reach ${baseUrl()}. Is the backend running with the dev profile, and is this page's origin (${location.origin}) allowed by CORS_ALLOWED_ORIGINS? (${err.message})` });
    } finally {
      button.disabled = false; button.textContent = "Execute";
    }
  };
}

function showResponse(r) {
  const box = $("#response");
  if (r.error) { box.innerHTML = `<div class="status err">${esc(r.error)}</div>`; return; }
  box.innerHTML = `<h3>Response</h3>
    <div class="status ${r.ok ? "ok" : "err"}"><span>${r.status} ${esc(r.statusText || "")}</span><span class="muted" style="font-weight:400">${r.ms} ms</span></div>
    ${r.saved ? `<div class="info">${esc(r.saved)}</div>` : ""}
    <p class="muted" style="margin-top:8px">${esc(r.url)}</p>
    ${r.body ? `<pre>${esc(r.body)}</pre>` : `<p class="muted">No body.</p>`}`;
}

// ------------------------------------------------- setup
// A saved server equal to this page's own origin came from the old default and points at the wrong server
const savedBaseUrl = store.get("nexhome.apiBaseUrl");
$("#baseUrl").value = savedBaseUrl && savedBaseUrl.replace(/\/+$/, "") !== location.origin ? savedBaseUrl : defaultBaseUrl();
$("#baseUrl").addEventListener("change", () => store.set("nexhome.apiBaseUrl", $("#baseUrl").value.trim()));
$("#accessToken").value = store.get("nexhome.accessToken") || "";
$("#accessToken").addEventListener("change", () => { store.set("nexhome.accessToken", accessToken()); showTokenState(); });
$("#clearTokens").onclick = () => { saveTokens("", ""); render(); };
$("#search").addEventListener("input", () => renderNav($("#search").value));
window.addEventListener("hashchange", render);
showTokenState();

const savedTheme = store.get("nexhome.theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  store.set("nexhome.theme", document.documentElement.dataset.theme);
};

render();
</script>
</body>
</html>
